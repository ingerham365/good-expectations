<title>Good Expectations CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#EDF0EA; --surface-3:#E3E7DF;
  --ink:#15211C; --ink-2:#34423C; --muted:#63716A; --line:#DCE0D7; --line-2:#C8CEC4;
  --accent:#0D6B50; --accent-hover:#0A5A43; --accent-soft:#DCEEE6; --on-accent:#FFFFFF;
  --money:#7A5B0E;
  --rail:#10261F; --rail-ink:#E3EEE9; --rail-muted:#8FB0A4; --rail-hover:#18342B; --rail-active:#22493B;
  --nba-bg:#15211C; --nba-ink:#F2F4EF; --nba-eyebrow:#E0B454; --nba-line:#3C4B44;
  --hot:#B93C0A; --hot-soft:#FBE6DA; --warm:#8A5A00; --warm-soft:#F7EDCF; --cold:#1C5CA3; --cold-soft:#DDE8F6; --nurture:#4A5157; --nurture-soft:#E4E7E9;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#137A48; --ok-soft:#DBF0E3;
  --c-call:#0D6B50; --c-text:#3867B8; --c-email:#B7791F; --c-meeting:#B4472A;
  --shadow:0 1px 2px rgba(16,38,31,.06),0 12px 32px rgba(16,38,31,.16);
  --ring:0 0 0 3px rgba(13,107,80,.22);
  --backdrop:rgba(12,24,20,.38);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#141C19; --surface-2:#1A2420; --surface-3:#212D28;
    --ink:#E3EAE6; --ink-2:#C3CEC8; --muted:#8C9D95; --line:#25312C; --line-2:#34433C;
    --accent:#3FBF94; --accent-hover:#5AD2A8; --accent-soft:#15332A; --on-accent:#06120E;
    --money:#DDB45C;
    --rail:#09100E; --rail-ink:#DDE8E3; --rail-muted:#7F998F; --rail-hover:#12201B; --rail-active:#193429;
    --nba-bg:#1D2A25; --nba-ink:#E9F0EC; --nba-eyebrow:#E0B454; --nba-line:#3A4A43;
    --hot:#F28C5E; --hot-soft:#3A2117; --warm:#E3B34C; --warm-soft:#33290F; --cold:#76AAEB; --cold-soft:#15263A; --nurture:#AEB5BB; --nurture-soft:#262B2F;
    --danger:#F0806F; --danger-soft:#3B1C18; --ok:#52CB8E; --ok-soft:#133126;
    --c-call:#3FBF94; --c-text:#76A5EC; --c-email:#E3B34C; --c-meeting:#F0886A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(63,191,148,.32);
    --backdrop:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#1A2420; --surface-3:#212D28;
  --ink:#E3EAE6; --ink-2:#C3CEC8; --muted:#8C9D95; --line:#25312C; --line-2:#34433C;
  --accent:#3FBF94; --accent-hover:#5AD2A8; --accent-soft:#15332A; --on-accent:#06120E;
  --money:#DDB45C;
  --rail:#09100E; --rail-ink:#DDE8E3; --rail-muted:#7F998F; --rail-hover:#12201B; --rail-active:#193429;
  --nba-bg:#1D2A25; --nba-ink:#E9F0EC; --nba-eyebrow:#E0B454; --nba-line:#3A4A43;
  --hot:#F28C5E; --hot-soft:#3A2117; --warm:#E3B34C; --warm-soft:#33290F; --cold:#76AAEB; --cold-soft:#15263A; --nurture:#AEB5BB; --nurture-soft:#262B2F;
  --danger:#F0806F; --danger-soft:#3B1C18; --ok:#52CB8E; --ok-soft:#133126;
  --c-call:#3FBF94; --c-text:#76A5EC; --c-email:#E3B34C; --c-meeting:#F0886A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(63,191,148,.32);
  --backdrop:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.money,time,.tile-n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.money{font-family:var(--f-mono);color:var(--money);font-size:.95em}
.stat .v .money,.tile-n .money{font:inherit}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}
.sel{user-select:all}
.warnText{color:var(--hot)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* layout */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--nba-eyebrow);color:#15211C;font:700 17px/1 var(--f-display);letter-spacing:.02em}
.b1{font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted)}
.b2{font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.nav-g{font:600 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:14px 10px 6px;min-height:10px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--rail-ink);padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px}
.nav-i:hover{background:var(--rail-hover)}
.nav-i[aria-current="page"]{background:var(--rail-active);font-weight:600}
.nav-i .cnt{margin-left:auto;font:500 11px/1 var(--f-mono);background:var(--nba-eyebrow);color:#15211C;border-radius:999px;padding:3px 6px}
.rail-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--rail-muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rail-muted);flex:none}
.dot.ok{background:#52CB8E}.dot.busy{background:#E0B454}.dot.bad{background:#F0806F}
.main{overflow-y:auto;min-width:0;padding-inline:28px;padding-block:0 56px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:18px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.top h1{font:600 32px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.top .sub{margin-top:4px;font-size:13px}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gsearch{position:relative;display:flex;align-items:center}
.gsearch .ic{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.gsearch input{width:240px;max-width:60vw;padding-left:32px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn[data-armed]{background:var(--danger-soft)!important;border-color:var(--danger)!important;color:var(--danger)!important}
.btn.sm{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:34px;padding:0;position:relative}
.icon-btn.sm{width:28px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--hot);color:#fff;font:600 10.5px/18px var(--f-mono);text-align:center}
.linkish{background:none;border:0;padding:0;color:inherit;text-align:left;font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],input:not([type]),select,textarea{min-height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;max-width:100%}
textarea{padding:8px 10px;resize:vertical;width:100%;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select{width:100%}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.err{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;min-height:22px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:0}
button.chip{cursor:pointer}
.temp{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;min-height:22px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-hot{background:var(--hot-soft);color:var(--hot)}.t-warm{background:var(--warm-soft);color:var(--warm)}.t-cold{background:var(--cold-soft);color:var(--cold)}.t-nurture{background:var(--nurture-soft);color:var(--nurture)}
.stage{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line-2);border-radius:6px;color:var(--ink-2);white-space:nowrap}
.ai-score{display:inline-grid;place-items:center;min-width:30px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--f-mono)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;white-space:nowrap}
.due.late{color:var(--danger)}.due.today{color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2{font:600 19px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.panel-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.banner>div{flex:1;min-width:220px}
.banner.warn{background:var(--warm-soft)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:15px}

/* command center */
.board{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:10px}
.tile{display:grid;align-content:start;gap:6px;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--line-2);background:var(--surface-2)}
.tile-l{display:flex;align-items:center;gap:6px;font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile-n{font:600 42px/0.95 var(--f-display);letter-spacing:.01em}
.tile-f{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--danger);background:var(--danger-soft)}
.tile.alert .tile-n,.tile.alert .tile-l{color:var(--danger)}
.tile.is-money .tile-n{color:var(--money)}
.cc-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
.cc-side{display:grid;gap:18px;min-width:0}
.chat{display:grid;gap:10px}
.chat .panel-h{margin-bottom:0}
.chat-log{height:440px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px;overscroll-behavior:contain}
.msg{max-width:94%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);white-space:pre-wrap;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:4px;display:grid;gap:6px}
.msg.bot .bt{display:grid;gap:6px}
.msg.bot .bt:empty{display:none}
.msg.bot ul{margin:0;padding-left:18px;display:grid;gap:2px}
.msg.bot h5{font:600 11.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.msg.bot .linkish{color:var(--accent)}
.acts{list-style:none;margin:2px 0 0;padding:8px 0 0;border-top:1px solid var(--line-2);display:grid;gap:6px}
.acts li{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.acts li>.ic{color:var(--ok)}
.acts li.undone>span:first-of-type{text-decoration:line-through;color:var(--muted)}
.chat-empty{margin:auto 0;display:grid;gap:12px;color:var(--muted);font-size:13.5px;padding:6px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .chip{min-height:28px;padding:4px 10px;text-align:left;white-space:normal;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.sugg .chip:hover{background:var(--surface-2)}
.chat-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.chat-in textarea{min-height:44px;max-height:160px;resize:none}
.chat-status{font-size:12.5px}
.wq{list-style:none;margin:0;padding:0;display:grid}
.wq-i{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 4px;border-top:1px solid var(--line)}
.wq-i:first-child{border-top:0}
.wq-n{font:600 22px/1 var(--f-display);color:var(--muted);text-align:right;padding-top:2px}
.wq-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wq-name{font-size:15px}
.wq-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.wq-nba{margin-top:6px;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.wq-nba .ic{margin-top:2px;color:var(--warm)}
.wq-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.qa{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.qa:hover{background:var(--surface-2)}
.qa.rec{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.goal{display:grid;gap:6px;padding:8px 0}
.goal-h{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.goal-h span{display:flex;align-items:center;gap:6px}
.goal-h b{font:600 18px/1 var(--f-display);letter-spacing:.02em}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.goal.done .bar i{background:var(--ok)}
.cal{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cal li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.cal li:first-child{border-top:0}
.cal time{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.ai-out{font-size:13.5px;line-height:1.55;color:var(--ink-2);display:grid;gap:6px}
.ai-out h5{font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.ai-out ul{margin:0;padding-left:18px;display:grid;gap:2px}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* inbox */
.ib{list-style:none;margin:0;padding:0;display:grid}
.ib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.ib-row:first-child{border-top:0}
.ib-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ib-why{margin-top:6px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.speed{font:500 12px/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}
.speed.mid{background:var(--warm-soft);color:var(--warm)}
.speed.late{background:var(--hot-soft);color:var(--hot)}
.ib-acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.ib-acts .sep{width:1px;background:var(--line);margin:4px}
.quote{color:var(--muted);font-style:italic;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* leads */
.views{display:flex;gap:6px;flex-wrap:wrap}
.vchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;color:var(--ink-2)}
.vchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.vchip .linkish{font-weight:500}
.vchip .n{font:500 11px/1 var(--f-mono);opacity:.75}
.vchip .x{border:0;background:none;padding:0 0 0 2px;color:inherit;opacity:.6;display:inline-flex}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{width:220px}
.filters .end{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.bulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--bg)}
.bulk b{margin-right:6px;font-size:13px}
.bulk .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.bulk .btn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.is-sel td{background:var(--accent-soft)}
.tbl .num{text-align:right}
.tbl .c-chk{width:36px}
.tbl .c-lead{min-width:190px}
.tbl .c-next{min-width:180px}
.strong{font-weight:600}

/* pipeline */
.kanban-wrap{overflow-x:auto;padding-bottom:6px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;min-width:max-content}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;align-content:start;gap:8px;min-height:240px;border:1px dashed transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col header{display:grid;gap:2px;padding:2px 4px 6px}
.col h3{font:600 16px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.col h3 span{font:500 12px/1 var(--f-mono);color:var(--muted)}
.col .col-v{font-size:12px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;cursor:grab;text-align:left}
.kcard:hover{border-color:var(--line-2)}
.kcard .kn{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.kcard .kf{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.stat .l{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 30px/1 var(--f-display);letter-spacing:.01em}
.stat .f{font-size:12px;color:var(--muted)}

/* companies */
.co-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.contacts{display:grid;gap:8px}
.ct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:22px;border-left:1px solid var(--line-2);margin-left:10px}
.tree li{position:relative;padding:5px 0}
.tree ul>li::before{content:"";position:absolute;left:-22px;top:20px;width:18px;border-top:1px solid var(--line-2)}
.node{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left}
.node.root{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* tasks */
.tgroup h3{font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px;display:flex;gap:8px;align-items:center}
.tgroup h3 .n{font:500 12px/1 var(--f-mono)}
.tgroup.late h3{color:var(--danger)}
.tlist{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.trow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{font-weight:500}
.tic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}

/* sequences */
.seq{display:grid;gap:12px}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:8px}
.step{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:120px}
.step .d{font:600 12px/1 var(--f-mono);color:var(--muted)}
.step .c{display:flex;gap:6px;align-items:center;font-weight:600}
.arrow{display:grid;place-items:center;color:var(--muted);padding:0 6px}
.srows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:80px 120px minmax(0,1fr) minmax(0,1fr) 170px auto;gap:8px;align-items:end}
@media (max-width:1080px){ .srow{grid-template-columns:80px 120px minmax(0,1fr) auto} .srow .sn{grid-column:3 / -1} }

/* templates */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:18px;align-items:start}
.tpl{display:grid;gap:10px}
.tpl-name{display:flex;gap:8px;align-items:center}
.tpl-name input{flex:1;min-width:0;font-weight:600}
.tpl textarea{resize:vertical}
.tpl-fields{display:flex;flex-wrap:wrap;gap:4px}
.tpl-fields .chip{min-height:26px;padding:2px 8px}
.tpl-pv{white-space:pre-wrap;font-size:13px;padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-top:8px;overflow-wrap:anywhere}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.chip code{background:none;padding:0}

/* good meetings */
.gm-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.gm-new{display:grid;gap:12px}
.gm-new .panel-h{margin-bottom:0}
.gm-tips{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px;color:var(--ink-2)}
.gm-tips li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start}
.gm-tips .ic{margin-top:2px;color:var(--accent)}
.gm-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.gm-row:first-child{border-top:0}
.gm-when{display:grid;gap:2px}
.gm-when b{font:600 18px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.gm-when span{font-size:12.5px;color:var(--muted)}
.gm-link{overflow-wrap:anywhere;user-select:all}
.gm-acts{gap:4px;justify-content:flex-end}
.gm-inv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.gm-now{margin-top:6px}
.gm-box{display:grid;gap:6px;margin-top:10px;padding:12px;border-radius:10px;background:var(--accent-soft)}
@media (max-width:860px){ .gm-grid{grid-template-columns:minmax(0,1fr)} .gm-row{grid-template-columns:minmax(0,1fr)} .gm-when{grid-auto-flow:column;justify-content:start;gap:8px;align-items:baseline} .gm-acts{justify-content:flex-start} }

/* scheduled */
.olist{list-style:none;margin:0;padding:0;display:grid}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow.canceled{opacity:.6}
.sub.err{color:var(--danger)}

/* dashboard */
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.share{height:6px;border-radius:99px;background:var(--surface-3);min-width:60px;overflow:hidden}
.share i{display:block;height:100%;background:var(--money)}
.rank{font:600 18px/1 var(--f-display);color:var(--muted)}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.list-edit{display:flex;gap:6px;flex-wrap:wrap}
.pill-x{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--surface-2);font-size:13px}
.pill-x button{border:0;background:none;display:inline-flex;padding:2px;border-radius:50%;color:var(--muted)}
.int{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.int:first-of-type{border-top:0}
.st{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.off{background:var(--surface-3);color:var(--muted)}.st.warn{background:var(--warm-soft);color:var(--warm)}
.cf{display:grid;grid-template-columns:minmax(0,1.2fr) 110px minmax(0,1.4fr) auto;gap:6px;align-items:center;margin-bottom:6px}
/* calendar (bundled Hash Calendar) */
.cal-wrap{display:grid;gap:8px}
.cal-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cal-tools .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
#calFrame{display:block;width:100%;height:max(560px,calc(100vh - 210px));border:1px solid var(--line);border-radius:12px;background:#fff}
.cal-wrap.full{position:fixed;inset:0;z-index:60;background:var(--bg);padding:12px;grid-template-rows:auto minmax(0,1fr) auto}
.cal-wrap.full #calFrame{height:100%}
.set-grid>section{scroll-margin-top:130px;display:grid;gap:8px;align-content:start}
.set-grid .panel-h{margin-bottom:0}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump .chip{min-height:28px;padding:4px 10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.jump .chip:hover{background:var(--surface-2)}
.dh{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stg-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stg{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:38px}
.stg .mono{color:var(--muted);font-size:12px;text-align:right}
.auto-seq{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tile-toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.fld small.hint{font-size:11.5px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.dr-back{position:absolute;inset:0;background:var(--backdrop)}
.dr-panel{position:relative;width:min(640px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.focusbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--ink);color:var(--bg);font-size:13px}
.focusbar b{font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.focusbar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.focusbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.focusbar .btn.primary{background:var(--nba-eyebrow);color:#15211C;border-color:var(--nba-eyebrow)}
.dr-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-head h2{font:600 28px/1 var(--f-display);letter-spacing:.02em}
.dr-sub{margin-top:4px;color:var(--muted);font-size:13px}
.dr-hb{display:flex;gap:6px}
.dr-scroll{overflow-y:auto;flex:1;padding:16px 20px calc(48px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.dsec>h4,.dh{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tpick{display:inline-flex;gap:4px;flex-wrap:wrap}
.tpick button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tpick button[aria-pressed="true"].t-hot{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.tpick button[aria-pressed="true"].t-warm{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.tpick button[aria-pressed="true"].t-cold{background:var(--cold-soft);border-color:var(--cold);color:var(--cold)}
.tpick button[aria-pressed="true"].t-nurture{background:var(--nurture-soft);border-color:var(--nurture);color:var(--nurture)}
.tpick button[aria-pressed="false"]{background:var(--surface);color:var(--muted)}
.ai-sug{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.cinfo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.cinfo .k{color:var(--muted);font-size:12px}
.cinfo .v{overflow-wrap:anywhere}
.cinfo .a{display:flex;gap:4px;justify-content:flex-end}
.nba{background:var(--nba-bg);color:var(--nba-ink);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.nba .e{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--nba-eyebrow);display:flex;align-items:center;gap:6px}
.nba p{font-size:15.5px;line-height:1.45}
.nba .b{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nba .btn{border-color:var(--nba-line);background:transparent;color:var(--nba-ink)}
.nba .btn.primary{background:var(--nba-eyebrow);border-color:var(--nba-eyebrow);color:#15211C}
.nba .thinking{color:var(--nba-ink)}
.opp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.opp .w{display:grid;gap:4px}
.opp .w b{font:600 20px/34px var(--f-display);color:var(--money)}
.ai-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ai-fu{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ai-fu .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.ai-box{margin-top:10px;padding:12px;border-radius:10px;background:var(--surface-2);display:grid;gap:8px}
.ai-box .t{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px -4px 12px}
.tabs button{border:0;background:none;padding:8px 10px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{display:grid;gap:10px}
.dial{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dial .big{font:500 20px/1 var(--f-mono);letter-spacing:.02em}
.bubbles{display:grid;gap:6px;max-height:260px;overflow-y:auto;padding:4px}
.bub{max-width:80%;padding:7px 11px;border-radius:14px;font-size:13.5px;background:var(--surface-2);justify-self:start;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.out{justify-self:end;background:var(--accent);color:var(--on-accent)}
.bub time{display:block;font-size:11px;opacity:.75;margin-top:2px}
.dtasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dtasks li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.dtasks li span:nth-child(2){display:flex;gap:6px;align-items:center}
.tl-f{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:12px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl-i{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl-i::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tl-i.t-call .tl-dot{color:var(--c-call)}.tl-i.t-text .tl-dot{color:var(--c-text)}.tl-i.t-email .tl-dot{color:var(--c-email)}.tl-i.t-meeting .tl-dot{color:var(--c-meeting)}
.tl-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;padding-top:5px}
.tl-h b{font:600 12px/1 var(--f-body);letter-spacing:.1em}
.tl-h time{margin-left:auto;color:var(--muted);font-size:12px}
.tl-s{font-weight:600;margin-top:3px}
.tl-b{margin-top:3px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
.tl-i.t-system .tl-b,.tl-i.t-stage .tl-b{color:var(--muted);font-size:12.5px}
.tl-l{margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.tl-l a{display:inline-flex;gap:4px;align-items:center}
.es{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.es.sent{background:var(--cold-soft);color:var(--cold)}.es.replied{background:var(--ok-soft);color:var(--ok)}.es.draft{background:var(--warm-soft);color:var(--warm)}.es.in{background:var(--accent-soft);color:var(--accent)}
details.more summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* modal / pop / toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
[hidden]{display:none!important}
.m-back{position:absolute;inset:0;background:var(--backdrop)}
.m-card{position:relative;width:min(580px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:grid}
.m-card header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;gap:10px}
.m-card h3{font:600 22px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.m-body{padding:8px 18px 12px;display:grid;gap:12px}
.m-card footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-width:min(340px,calc(100vw - 16px));display:grid;gap:2px;max-height:60vh;overflow:auto}
.pop .pi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left;font-size:13.5px}
.pop .pi:hover,.pop .pi:focus-visible{background:var(--surface-2)}
.pop .ph{font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pop .pf{padding:6px;display:grid;gap:8px}
.pop .pi .sub{margin-left:auto;padding-left:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:6px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}

/* responsive */
@media (max-width:1280px){ .board{grid-template-columns:repeat(4,minmax(0,1fr))} .mgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:1080px){ .cc-grid{grid-template-columns:minmax(0,1fr)} .two{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .brand,.nav-g,.rail-foot{display:none}
  .nav-i{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px;width:auto;min-width:66px;align-items:center;position:relative;white-space:nowrap}
  .nav-i .cnt{position:absolute;top:2px;right:6px;margin:0;padding:2px 5px;font-size:10px}

function tasksAll() { const out = []; for (const l of S.leads.values()) for (const t of (l.tasks || [])) out.push({ t, l }); return out; }
function meetingsBetween(a, b) { const out = []; for (const l of S.leads.values()) for (const x of acts(l)) if (x.type === 'meeting' && x.scheduledFor) { const t = new Date(x.scheduledFor); if (t >= a && t < b) out.push({ a: x, l }); } return out.sort((x, y) => x.a.scheduledFor.localeCompare(y.a.scheduledFor)); }

  const T = todayYmd(), act = activeLeads();

  const due = ty => tasks.filter(x => x.t.type === ty && x.t.due <= T).length;
  const s = startOfDay(now());
  return {
    hot: act.filter(l => l.temperature === 'hot').length,
    calls: due('call'), texts: due('text'),
    emails: due('email') + act.filter(l => awaitingReply(l)?.type === 'email').length,
    meetings: meetingsBetween(s, addDays(s, 1)).length,
    overdue: tasks.filter(x => x.t.due < T).length,

}
function goalsToday() {
  const T = todayYmd(), [ws, we] = weekRange(); const g = { calls: 0, texts: 0, emails: 0, mtg: 0 };
  for (const l of S.leads.values()) for (const a of acts(l)) {
    if (a.dir !== 'out') continue;
    if (ymd(a.at) === T) { if (a.type === 'call') g.calls++; else if (a.type === 'text') g.texts++; else if (a.type === 'email' && a.status !== 'draft') g.emails++; }
    if (a.type === 'meeting') { const t = new Date(mtime(a)); if (t >= ws && t < we) g.mtg++; }
  }
  return g;
}

/* ---------------- Automation: sequences + notifications ---------------- */
const Auto = {
  enroll(l, seqId, start = todayYmd()) {
    const seq = S.settings.sequences.find(s => s.id === seqId); if (!seq) return false;
    this.unenroll(l, { silent: true });
    const base = ymdToDate(start); let autos = 0;
    seq.steps.slice().sort((a, b) => a.day - b.day).forEach((st, i) => {
      let dd = addDays(base, +st.day || 0);
      if (P().seq.skipWeekends) while (dd.getDay() === 0 || dd.getDay() === 6) dd = addDays(dd, 1);
      const due = ymd(dd), tpl = st.templateId ? tplById(st.templateId) : null;
      if (st.channel === 'email' && st.auto && tpl && l.email) {
        const m = fillTpl(tpl, l);
        Outbox.add({ lead: l, subject: m.subject, body: m.body, sendAt: sendTimeOn(due), source: 'sequence', seqId: seq.id, seqName: seq.name, templateId: tpl.id, step: i }); autos++;
      } else if (st.channel === 'text' && st.auto && tpl && l.phone && SMS.enabled()) {
        Outbox.add({ lead: l, channel: 'text', body: fillTpl(tpl, l).body, sendAt: sendTimeOn(due), source: 'sequence', seqId: seq.id, seqName: seq.name, templateId: tpl.id, step: i }); autos++;
      } else addTask(l, { type: st.channel, title: st.note || (tpl ? tpl.name : `${CH[st.channel]} (${seq.name})`), due, seq: seq.id, seqName: seq.name, day: +st.day || 0, step: i, templateId: tpl ? tpl.id : undefined });
    });
    l.sequence = { id: seq.id, name: seq.name, startedAt: iso(now()) };
    logActivity(l, { type: 'system', body: `Added to sequence: ${seq.name} (${seq.steps.length} steps${autos ? `, ${autos} message${autos > 1 ? 's' : ''} sending automatically` : ''})` });
    return true;
  },
  unenroll(l, { silent, reason } = {}) {
    if (!l.sequence) return; const id = l.sequence.id;
    l.tasks = (l.tasks || []).filter(t => t.done || t.seq !== id);
    Outbox.cancelFor(l.id, id);
    if (!silent) logActivity(l, { type: 'system', body: reason || `Removed from sequence: ${l.sequence.name}` });
    l.sequence = null;
  },
  progress(l) { if (!l.sequence) return { done: 0, total: 0 }; const ts = (l.tasks || []).filter(t => t.seq === l.sequence.id); const os = Outbox.list().filter(o => o.leadId === l.id && o.seqId === l.sequence.id && o.status !== 'canceled'); return { done: ts.filter(t => t.done).length + os.filter(o => o.status === 'sent').length, total: ts.length + os.length }; },
  notifications() {
    const out = [], T = todayYmd(), s = startOfDay(now());
    for (const l of activeLeads()) {
      const r = awaitingReply(l);
      if (r) out.push({ l, pr: 3, kind: 'reply', at: r.at, text: `${l.name} replied by ${r.type}`, sub: ago(r.at) });
      if (!l.contacted && !isSnoozed(l)) out.push({ l, pr: 2, kind: 'new', at: l.createdAt, text: `New ${l.source || ''} lead: ${l.name}`, sub: `waiting ${ago(l.createdAt).replace(' ago', '')}` });
      const od = openTasks(l).filter(t => t.due < T).length;
      if (od) out.push({ l, pr: 1, kind: 'overdue', at: '', text: `${od} overdue task${od > 1 ? 's' : ''} for ${l.name}`, sub: 'overdue' });
    }
    for (const m of meetingsBetween(s, addDays(s, 1))) out.push({ l: m.l, pr: 2, kind: 'meeting', at: m.a.scheduledFor, text: `Meeting with ${m.l.name}`, sub: fmtTime(m.a.scheduledFor) });
    for (const o of Outbox.attention()) { const l = S.leads.get(o.leadId); if (l) out.push({ l, pr: 3, kind: 'outbox', at: o.sendAt, text: `Scheduled email to ${l.name} ${o.status === 'failed' ? 'failed' : 'needs attention'}`, sub: fmtDT(o.sendAt) }); }
    for (const l of activeLeads()) for (const t of openTasks(l)) if (t.type === 'text' && t.sendAt && new Date(t.sendAt) <= now()) out.push({ l, pr: 3, kind: 'textdue', tid: t.message ? t.id : '', at: t.sendAt, text: `Time to send your scheduled text to ${l.name}`, sub: fmtDT(t.sendAt) });
    const N = P().notify || {};
    return out.filter(x => N[x.kind === 'textdue' ? 'outbox' : x.kind] !== false).sort((a, b) => b.pr - a.pr || (b.at || '').localeCompare(a.at || ''));
  },
};

/* ---------------- AI (sample capability) ---------------- */
const AI = {
  fn: null, ctl: {},
  on() { return !!this.fn && S.int.ai !== 'off'; },
  async run(key, prompt, { tier = 'default', json = false, onText, cache = true } = {}) {
    const f = this.fn; if (!f) throw { code: 'not_granted' };
    this.ctl[key]?.abort();
    const ctl = new AbortController(); this.ctl[key] = ctl;
    try {
      if (json) return await f.json(prompt, { modelTier: tier, signal: ctl.signal, cache });
      const r = await f(prompt, { modelTier: tier, signal: ctl.signal, onText, cache });
      return r.text;
    } catch (e) {
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e?.code)) { S.int.ai = 'off'; scheduleRender(); }
      throw e;
    } finally { if (this.ctl[key] === ctl) delete this.ctl[key]; }
  },
  stop(key) { this.ctl[key]?.abort(); },
  err(e) {
    switch (e?.code) {
      case 'cancelled': return '';

    const tasks = openTasks(l).map(t => `- ${t.due}: ${t.title}`).join('\n');
    return `Today is ${longDate(now())}. The rep is ${me()}.

Name: ${l.name}
Title: ${l.title || 'unknown'}
Company: ${l.company || 'unknown'}${c?.industry ? ' (industry: ' + c.industry + ')' : ''}${c?.website ? ', website ' + c.website : ''}

Source: ${l.source}
Temperature: ${l.temperature}; Stage: ${l.stage}
Opportunity: ${l.value ? money(l.value) : 'none set'}, probability ${l.probability || 0}%, expected close ${l.expectedClose || 'not set'}
Created: ${ymd(l.createdAt)}; Last contacted: ${l.lastTouchAt ? ymd(l.lastTouchAt) : 'never'}; Total touches: ${l.touches || 0}
Tags: ${(l.tags || []).join(', ') || 'none'}
${cf ? 'Custom fields: ' + cf + '\n' : ''}${l.sequence ? 'In follow-up sequence: ' + l.sequence.name + '\n' : ''}OPEN TASKS

/* ---------------- Communication ---------------- */
const Comms = {
  async gmail(l0, draft) {
    const subject = ($('#cmp-email-subject')?.value || '').trim(), body = ($('#cmp-email-body')?.value || '').trim();
    if (!l0.email) return status('emailStatus', 'Add an email address for this lead first (Edit details).', true);
    if (!body) return status('emailStatus', 'Write the email first.', true);
    status('emailStatus', draft ? 'Saving draft to Gmail…' : 'Sending with Gmail…');
    try {
      const sb = withSig(body);
      const p = await MCP.call('Gmail', draft ? 'create_draft' : 'send_message', { to: [l0.email], subject, body: sb });
      const l = fresh(l0);
      logActivity(l, { type: 'email', dir: 'out', subject, body: sb, status: draft ? 'draft' : 'sent', gmail: { id: p?.id || '', threadId: p?.threadId || '', url: p?.viewUrl || '' } });
      S.int.gmail = 'ready';
      clearInputs(['cmp-email-subject', 'cmp-email-body']); status('emailStatus', '');
      saveLead(l);
      toast(draft ? 'Draft saved in Gmail' : `Email sent to ${l.email}`);
    } catch (e) { status('emailStatus', MCP.err(e, 'Gmail', !draft), true); }
  },
  async checkReplies(list, { quiet } = {}) {
    const targets = list.filter(l => l.email && acts(l).some(a => a.type === 'email' && a.dir === 'out' && a.status !== 'draft' && daysBetween(a.at, now()) <= 30));
    if (!targets.length) { if (!quiet) toast('No emails sent in the last 30 days to check.'); return 0; }
    let found = 0; const touched = new Set();
    for (let i = 0; i < targets.length; i += 12) {
      const chunk = targets.slice(i, i + 12), by = new Map(chunk.map(l => [l.email.toLowerCase(), l.id]));
      const p = await MCP.call('Gmail', 'search_threads', { query: `from:(${chunk.map(l => l.email).join(' OR ')}) newer_than:30d`, pageSize: 50 });
      for (const th of (p?.threads || [])) for (const m of (th.messages || [])) {
        const id = by.get(emailOf(m.sender)); const l = id && S.leads.get(id); if (!l) continue;
        const aid = 'gm_' + m.id; if (acts(l).some(a => a.id === aid)) continue;
        const at = m.date ? iso(m.date) : iso(now());
        const lastOut = acts(l).find(a => a.type === 'email' && a.dir === 'out' && a.status !== 'draft' && a.at < at);
        if (!lastOut) continue;
        logActivity(l, { id: aid, type: 'email', dir: 'in', subject: m.subject || '', body: m.snippet || '', at, gmail: { threadId: m.threadId || th.id, url: m.viewUrl || th.viewUrl || '' } });
        lastOut.status = 'replied'; found++; touched.add(l.id);
      }
    }
    touched.forEach(id => { const l = S.leads.get(id); if (l) saveLead(l); });
    if (!quiet) toast(found ? `Found ${found} new repl${found > 1 ? 'ies' : 'y'}. They're at the top of the Lead Inbox.` : 'No new replies yet.');
    return found;
  },
  async syncLead(l0) {
    if (!l0.email) return toast('This lead has no email address.', 'err');
    const e = l0.email.toLowerCase();
    const p = await MCP.call('Gmail', 'search_threads', { query: `from:${l0.email} OR to:${l0.email} newer_than:1y`, pageSize: 20 });
    const l = fresh(l0); let n = 0;
    for (const th of (p?.threads || [])) for (const m of (th.messages || [])) {
      const aid = 'gm_' + m.id; if (acts(l).some(a => a.id === aid)) continue;
      const inbound = emailOf(m.sender) === e;
      logActivity(l, { id: aid, type: 'email', dir: inbound ? 'in' : 'out', status: inbound ? undefined : 'sent', subject: m.subject || '', body: m.snippet || '', at: m.date ? iso(m.date) : iso(now()), gmail: { threadId: m.threadId || th.id, url: m.viewUrl || th.viewUrl || '' } }, { complete: false });
      n++;
    }
    const em = acts(l).filter(a => a.type === 'email').slice().reverse();
    em.forEach((a, i) => { if (a.dir === 'out' && a.status === 'sent' && em.slice(i + 1).some(b => b.dir === 'in')) a.status = 'replied'; });
    if (n) saveLead(l);
    toast(n ? `Imported ${n} email${n > 1 ? 's' : ''} from Gmail` : 'The timeline already has every Gmail message with this lead.');
  },
};

/* ---------------- Analytics ---------------- */
const Stats = {
  range(days) { const e = now(); return [startOfDay(addDays(e, -(days - 1))), e]; },
  compute(days) {
    const [s, e] = this.range(days), inR = t => t && new Date(t) >= s && new Date(t) <= e;
    const L = leadsArr(); let calls = 0, texts = 0, emails = 0, meetings = 0;
    for (const l of L) for (const a of acts(l)) {
      if (a.dir !== 'out') continue;
      if (a.type === 'call' && inR(a.at)) calls++;
      else if (a.type === 'text' && inR(a.at)) texts++;
      else if (a.type === 'email' && a.status !== 'draft' && inR(a.at)) emails++;
      else if (a.type === 'meeting' && inR(mtime(a))) meetings++;
    }
    const created = L.filter(l => inR(l.createdAt)), opps = L.filter(l => inR(l.convertedAt));
    const won = L.filter(l => l.stage === 'Won' && inR(l.wonAt)), lost = L.filter(l => l.stage === 'Lost' && inR(l.lostAt));
    const revenue = won.reduce((a, l) => a + (+l.value || 0), 0);
    const cycles = won.map(l => (new Date(l.wonAt) - new Date(l.createdAt)) / DAY).filter(x => x >= 0);
    return { calls, texts, emails, meetings, leads: created.length, opps: opps.length, won: won.length, lost: lost.length, revenue,
      conv: created.length ? won.length / created.length : 0, winRate: (won.length + lost.length) ? won.length / (won.length + lost.length) : 0,
      avgDeal: won.length ? revenue / won.length : 0, cycle: cycles.length ? cycles.reduce((a, b) => a + b, 0) / cycles.length : 0, s, e };
  },
  series(days) {
    const [s] = this.range(days); const bucket = days <= 31 ? 1 : days <= 120 ? 7 : 30;
    const n = Math.ceil(days / bucket); const rows = Array.from({ length: n }, (_, i) => ({ d: addDays(s, i * bucket), call: 0, text: 0, email: 0, meeting: 0 }));
    for (const l of S.leads.values()) for (const a of acts(l)) {
      if (a.dir !== 'out' || !['call', 'text', 'email', 'meeting'].includes(a.type) || a.status === 'draft') continue;
      const i = Math.floor(daysBetween(s, a.at) / bucket);
      if (i >= 0 && i < n) rows[i][a.type]++;
    }
    return { rows, bucket };
  },
  sources(days) {
    const [s, e] = this.range(days), inR = t => t && new Date(t) >= s && new Date(t) <= e;
    const names = [...new Set([...S.settings.sources, ...leadsArr().map(l => l.source).filter(Boolean)])];
    return names.map(src => {
      const L = leadsArr().filter(l => (l.source || 'Manually added') === src && inR(l.createdAt));
      const won = L.filter(l => l.stage === 'Won');
      return { src, leads: L.length, meetings: L.filter(l => acts(l).some(a => a.type === 'meeting')).length,
        opps: L.filter(l => l.convertedAt).length, won: won.length, revenue: won.reduce((a, l) => a + (+l.value || 0), 0) };
    }).filter(r => r.leads).sort((a, b) => b.revenue - a.revenue || b.meetings - a.meetings || b.leads - a.leads);
  },
  owners(days) {
    const [s, e] = this.range(days), inR = t => t && new Date(t) >= s && new Date(t) <= e;
    const names = [...new Set([...S.settings.team, ...leadsArr().map(l => l.owner).filter(Boolean)])];
    return names.map(o => {
      let calls = 0, meetings = 0;
      for (const l of S.leads.values()) for (const a of acts(l)) if (a.by === o && a.dir === 'out') { if (a.type === 'call' && inR(a.at)) calls++; if (a.type === 'meeting' && inR(mtime(a))) meetings++; }
      const mine = leadsArr().filter(l => l.owner === o);
      const won = mine.filter(l => l.stage === 'Won' && inR(l.wonAt)), created = mine.filter(l => inR(l.createdAt));
      return { o, calls, meetings, opps: mine.filter(l => inR(l.convertedAt)).length, revenue: won.reduce((a, l) => a + (+l.value || 0), 0), conv: created.length ? won.length / created.length : 0 };
    }).sort((a, b) => b.revenue - a.revenue || b.meetings - a.meetings || b.calls - a.calls);
  },
};

  const T = todayYmd(), wk = ymd(addDays(now(), 7));
  const all = tasksAll().filter(x => !isClosed(x.l) || x.t.done);
  const open = all.filter(x => !x.t.done).sort((a, b) => a.t.due.localeCompare(b.t.due));
  const groups = [
    ['Overdue', open.filter(x => x.t.due < T), 'late'], ['Today', open.filter(x => x.t.due === T), ''],
    ['Next 7 days', open.filter(x => x.t.due > T && x.t.due <= wk), ''], ['Later', open.filter(x => x.t.due > wk), ''],
  ];
  const done = all.filter(x => x.t.done && x.t.doneAt && daysBetween(x.t.doneAt, now()) <= 7).sort((a, b) => (b.t.doneAt || '').localeCompare(a.t.doneAt || ''));
  const row = ({ t, l }) => `<li class="trow ${t.done ? 'done' : ''}"><input type="checkbox" data-c="taskDone" data-id="${l.id}" data-t="${t.id}" ${t.done ? 'checked' : ''} aria-label="Complete ${esc(t.title)}"><span class="tic">${ic(t.type in CH ? t.type : 'task')}</span>
    <div class="tlead" style="min-width:0"><div class="ttl">${esc(t.title)}</div><div class="sub"><button type="button" class="linkish" style="font-weight:500" data-a="openTab" data-id="${l.id}" data-tab="${['call', 'text', 'email', 'meeting'].includes(t.type) ? t.type : 'task'}" data-tpl="${!t.done && (t.type === 'text' || t.type === 'email') ? esc(t.templateId || '') : ''}" data-mt="${!t.done && t.message ? t.id : ''}">${esc(l.name)}</button>${l.company ? ' · ' + esc(l.company) : ''}${t.seqName ? ` · ${esc(t.seqName)}` : ''}${t.message ? ' · message ready' : t.templateId && tplById(t.templateId) ? ` · ${esc(tplById(t.templateId).name)}` : ''}</div></div>
    <span class="due ${!t.done && t.due < T ? 'late' : !t.done && t.due === T ? 'today' : ''}">${t.done ? 'Done ' + ago(t.doneAt) : fmtDue(t.due)}</span>
    ${t.done ? '<span></span>' : `<button type="button" class="btn ghost icon-btn sm" data-a="taskMenu" data-id="${l.id}" data-t="${t.id}" aria-label="Task options">${ic('more')}</button>`}</li>`;
  return topbar('Tasks', `${open.filter(x => x.t.due <= T).length} due today or overdue · ${open.length} open`) + `
  ${open.length ? groups.filter(g => g[1].length).map(([name, list, cls]) => `<section class="tgroup ${cls}"><h3>${name} <span class="n">${list.length}</span></h3><ul class="tlist">${list.map(row).join('')}</ul></section>`).join('')
    : `<div class="panel empty"><b>No open tasks.</b><span>Tasks come from sequences, call follow-ups and anything you add on a lead.</span></div>`}
  ${done.length ? `<section class="tgroup"><h3>Completed this week <span class="n">${done.length}</span></h3><ul class="tlist">${done.slice(0, 30).map(row).join('')}</ul></section>` : ''}`;
};

      ${own.map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="strong">${esc(r.o)}</td><td class="num">${r.calls}</td><td class="num">${r.meetings}</td><td class="num">${r.opps}</td><td class="num"><span class="money">${moneyShort(r.revenue)}</span></td><td class="num">${pct(r.conv)}</td></tr>`).join('')}</tbody></table></div></section>

function chartSvg(P) {
  const { rows, bucket } = Stats.series(P);
  const W = 760, H = 230, L = 34, R = 8, Tp = 10, B = 28, cw = W - L - R, ch = H - Tp - B;
  const tot = r => r.call + r.text + r.email + r.meeting, max = Math.max(0, ...rows.map(tot));
  const nice = x => { if (x <= 1) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
  const step = nice(Math.max(1, max) / 4), top = Math.max(step, Math.ceil(max / step) * step);
  const y = v => Tp + ch - v / top * ch, bw = cw / rows.length, gap = Math.min(6, bw * 0.25);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`;
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    let acc = 0; const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap);
    for (const k of ['call', 'text', 'email', 'meeting']) { if (!r[k]) continue; const y0 = y(acc), y1 = y(acc + r[k]); g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5, y0 - y1).toFixed(1)}" fill="var(--c-${k})"><title>${fmtDate(r.d)}: ${r[k]} ${k}${r[k] > 1 ? 's' : ''}</title></rect>`; acc += r[k]; }
    if (i % every === 0) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${bucket === 30 ? r.d.toLocaleDateString('en-US', { month: 'short' }) : fmtDate(r.d)}</text>`;
  });
  const sum = rows.reduce((a, r) => a + tot(r), 0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Outbound activity per ${bucket === 1 ? 'day' : bucket === 7 ? 'week' : 'month'}, ${sum} touches in total">${g}</svg>${sum ? '' : '<p class="hint">No outbound activity in this period yet. Log calls, texts, emails and meetings to see the trend.</p>'}`;
}

    <span class="due">${mode === 'sent' ? 'Sent ' + fmtDT(o.sentAt) : fmtDT(o.sendAt)}</span>
    <span class="frow" style="gap:4px;justify-content:flex-end">${mode === 'sent' ? '' : `${stale ? `<button type="button" class="btn sm" data-a="obMarkSent" data-o="${o.id}">It sent</button><button type="button" class="btn sm ghost" data-a="obSend" data-o="${o.id}" data-confirm="Send it again?">Send again</button>` : gm && o.status !== 'sending' ? `<button type="button" class="btn sm" data-a="obSend" data-o="${o.id}">${o.status === 'failed' ? 'Retry' : 'Send now'}</button>` : ''}${o.status !== 'sending' || stale ? `<button type="button" class="btn sm ghost" data-a="obEdit" data-o="${o.id}">Edit</button><button type="button" class="btn sm ghost" data-a="obCancel" data-o="${o.id}" data-confirm="Cancel it?">Cancel</button>` : ''}`}</span></li>`; };
  const trow = ({ t, l }) => { const at = t.sendAt ? new Date(t.sendAt) : null, due = at ? at <= now() : t.due <= todayYmd(); return `<li class="orow">

  const sec = (title, list, body) => list.length ? `<section class="panel"><div class="panel-h"><h2>${title} <span class="mono">${list.length}</span></h2></div><ul class="olist">${body}</ul></section>` : '';
  const due = Outbox.due();
  return topbar('Scheduled', 'Emails set to send later, automatic sequence emails, and scheduled text reminders.') + `

  ${!gm ? `<div class="banner warn">${ic('alert')}<div><b>Gmail isn’t connected here.</b> Scheduled emails can’t go out until Gmail is available. Connect it in claude.ai Settings → Connectors.</div></div>` : ''}
  ${sec('Needs attention', att, att.map(o => row(o)).join(''))}
  ${sec('Upcoming emails', up, up.map(o => row(o)).join(''))}
  ${sec('Text reminders', texts, texts.map(trow).join(''))}

function renderDrawer() {
  const el = $('#drawer'), l = S.leads.get(S.drawer.leadId);
  if (!l) { closeDrawer(); return; }
  const same = el.dataset.lead === l.id;
  const draw = () => { el.innerHTML = drawerHtml(l); el.dataset.lead = l.id; applyDrafts(l); const b = $('#bubbles'); if (b) b.scrollTop = b.scrollHeight; };
  if (same) withPreserve(el, () => { const sc = $('#drScroll')?.scrollTop || 0; draw(); const n = $('#drScroll'); if (n) n.scrollTop = sc; });
  else draw();
  el.hidden = false;
}

async function aiLead(kind, l, extra = {}) {
  const channel = S.drawer.fuCh || P().ai.channel || 'email';
  const titles = { summary: 'Lead summary', prep: 'Call prep', follow: `${extra.tone || ''} ${channel === 'text' ? 'text' : 'email'} follow-up`, nba: 'Next best action' };
  const st = S.ai[l.id] = { kind, title: titles[kind], text: '', loading: true, err: null, channel, tone: extra.tone };
  render();
  const ctx = AI.context(l);
  const prompts = {
    summary: `Summarize this sales lead for a busy rep in 3 to 4 short sentences, in this style: "John is a warm prospect at ABC Company. Last contacted Sept. 24. Interested in enterprise software. $15K estimated opportunity. No response to last email. Recommended next action: call." Use only the facts below. Plain text, no markdown, no preamble.\n\n${ctx}`,
    prep: `Prepare a call prep sheet for the rep's next call with this lead. Use exactly these section headings on their own lines, in capitals: WHO THEY ARE, COMPANY, PREVIOUS CONVERSATIONS, CURRENT OPPORTUNITY, IMPORTANT NOTES, QUESTIONS TO ASK, SUGGESTED OPENING. Under each heading write 1 to 4 short bullet lines starting with "- ". QUESTIONS TO ASK has 3 to 5 specific discovery questions. SUGGESTED OPENING is one or two natural sentences the rep can say. Use only the data given, and write "Not recorded" when something is unknown. No other text.\n\n${ctx}`,
    follow: channel === 'text'
      ? `Write a text message follow-up from ${me()} to ${l.name}. Tone: ${extra.tone}. Under 300 characters. Reference something specific from the activity if there is anything. One clear next step. No placeholders in brackets, no hashtags, no emoji unless the tone is Casual or Friendly. Reply with only the message text.\n\n${ctx}`
      : `Write a follow-up email from ${me()} to ${l.name}. Tone: ${extra.tone}. First line: "Subject: " followed by the subject. Then a blank line, then the body (under 140 words; for the Short tone, under 60 words). Reference specifics from the activity, include one clear call to action, and sign off as ${me()}. No placeholders in brackets. Plain text, no markdown.\n\n${ctx}`,
    nba: `Recommend the single next best action for the rep on this lead. Reply in exactly two lines. Line 1: one or two sentences starting with a verb, like "Call John today. He hasn't been contacted in 4 days and has a $25,000 opportunity." Line 2: "ACTION: " followed by one of call, text, email, meeting, task.\n\n${ctx}`,
  };
  const tier = kind === 'nba' || kind === 'follow' ? 'quick' : 'default';
  try {
    const text = await AI.run('lead:' + l.id, prompts[kind], { tier, cache: kind === 'follow' ? false : true, onText: ({ text }) => { st.text = text; if (kind !== 'nba' && S.drawer.leadId === l.id) { const o = document.getElementById('aiText'); if (o) o.innerHTML = aiText(text); } } });
    st.loading = false; st.text = String(text || '').trim();
    if (kind === 'nba') { const m = st.text.match(/ACTION:\s*(call|text|email|meeting|task)/i); st.action = m ? m[1].toLowerCase() : 'task'; st.text = st.text.replace(/\n?\s*ACTION:.*$/i, '').trim(); }
    if (kind === 'summary') { const lead = S.leads.get(l.id); if (lead) { lead.summary = { text: st.text, at: iso(now()) }; saveLead(lead); } }
  } catch (e) {
    st.loading = false;
    if (e?.code === 'cancelled') { st.text = e.text || ''; st.err = st.text ? 'Stopped.' : null; if (!st.text) delete S.ai[l.id]; }
    else { st.err = AI.err(e); st.text = e?.code === 'refused' ? '' : (e?.text || ''); }
  }
  render();
}

const fillTpl = (t, l) => ({ subject: mergeText(t.subject, l), body: mergeText(t.body, l) });
const withSig = body => { const p = P().profile, sig = String(p.signature || '').trim(); return p.appendSignature && sig && !String(body).includes(sig) ? `${String(body).trimEnd()}\n\n${sig}` : body; };
function applyTpl(l, id) { const t = tplById(id); if (!t || !l) return; const m = fillTpl(t, l); if (t.channel === 'email') { setField('cmp-email-subject', m.subject); setField('cmp-email-body', m.body); } else setField('cmp-text-body', m.body); }

function sendTimeOn(due) { const [h, m] = String(P().send.time || '09:00').split(':').map(Number); const d = ymdToDate(due); d.setHours(h || 0, m || 0, 0, 0); return iso(d < now() ? new Date(Date.now() + 2 * 60000) : d); }

/* ---------------- Texting through Quo (MCP) ---------------- */
const SMS = {
  inboxes: [], checked: false,
  txt(p) { if (p == null) return ''; if (typeof p === 'string') return p; if (Array.isArray(p.content)) return p.content.map(c => c?.text || '').join('\n'); if (typeof p.text === 'string') return p.text; if (typeof p.result === 'string') return p.result; try { return JSON.stringify(p); } catch { return ''; } },
  e164(v) { const raw = String(v || '').trim(); if (!raw) return ''; const d = raw.replace(/\D/g, ''); if (raw.startsWith('+')) return '+' + d; if (d.length === 10) return '+1' + d; if (d.length === 11 && d[0] === '1') return '+' + d; return d ? '+' + d : ''; },
  pretty(v) { const m = String(v || '').match(/^\+1(\d{3})(\d{3})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : String(v || ''); },
  async init() {
    if (!MCP.api) { S.int.sms = 'off'; return; }
    try {
      const p = await MCP.call('Quo', 'list-inboxes', {});
      const nums = new Set(); const walk = x => { if (!x) return; if (typeof x === 'string') { (x.match(/\+\d{8,15}/g) || []).forEach(n => nums.add(n)); return; } if (Array.isArray(x)) return x.forEach(walk); if (typeof x === 'object') Object.values(x).forEach(walk); };
      walk(p); this.inboxes = [...nums]; S.int.sms = this.inboxes.length ? 'ready' : 'none';
    } catch (e) { S.int.sms = e?.code === 'needs_reauth' ? 'reauth' : ['server_not_connected'].includes(e?.code) ? 'missing' : e?.code === 'not_in_manifest' ? 'denied' : 'off'; }
    this.checked = true; scheduleRender();
  },
  from() { const f = P().sms?.from; return f && this.inboxes.includes(f) ? f : this.inboxes[0] || ''; },
  on() { return S.int.sms === 'ready' && !!this.from(); },
  enabled() { return S.int.sms !== 'off' && S.int.sms !== 'missing' && S.int.sms !== 'denied'; },
  err(e) {
    switch (e?.code) {
      case 'needs_reauth': S.int.sms = 'reauth'; return 'Reconnect Quo in claude.ai Settings → Connectors, then try again.';
      case 'server_not_connected': S.int.sms = 'missing'; return 'Add Quo in claude.ai Settings → Connectors to text from the CRM.';
      case 'not_in_manifest': S.int.sms = 'denied'; return 'Quo is turned off for this CRM. Allow it in the page’s permissions.';
      case 'opted_out': return 'This lead opted out of texts. Turn texting back on in Messages if they asked you to.';
      case 'tool_error': return `Quo reported a problem: ${e.message || 'unknown error'}`;
      case 'server_unavailable': case 'upstream_error': return 'Quo didn’t confirm the text. Check your Quo app before sending again so it doesn’t go out twice.';
      case 'not_granted': case 'capability_disabled': case 'capability_removed': S.int.sms = 'off'; return 'Texting isn’t available in this view.';
      default: return 'The text didn’t send. Try again.';
    }
  },
  async send(l0, body, extra) {
    const to = this.e164(l0.phone); if (!to) throw { code: 'no_phone' }; if (fresh(l0).textOptOut) throw { code: 'opted_out' };
    const p = await MCP.call('Quo', 'send-message', { from: this.from(), to, content: body });
    const l = fresh(l0); logActivity(l, clean({ type: 'text', body, via: 'quo', status: 'sent', ...(extra || {}) })); saveLead(l); return p;
  },
  /* Parses Quo's message lines: "AC… | +1555… | incoming | 2026-09-28T…" followed by the text. */
  parse(t) {
    const out = [], lines = String(t || '').split('\n'); let cur = null;
    const hd = /^\s*(AC[\w-]+)\s*\|\s*(\+\d{6,15})\s*\|\s*(\w+)\s*\|\s*(\S+)\s*$/;
    for (const ln of lines) {
      const m = ln.match(hd);
      if (m) { if (cur) out.push(cur); cur = { id: m[1], phone: m[2], dir: /^(in|incoming|inbound|received)$/i.test(m[3]) ? 'in' : 'out', at: m[4], body: [], media: [] }; continue; }
      if (!cur) continue;
      if (/^\s*media:\s/.test(ln)) { const mm = ln.replace(/^\s*media:\s*/, '').trim().match(/^(\S+)\s+(\S+)$/); if (mm) cur.media.push({ type: mm[1], url: mm[2] }); else cur.media.push({ type: '', url: ln.replace(/^\s*media:\s*/, '').trim() }); continue; }
      if (/^\s*(\[|---|Conversation|Contact|CN[\w-]+)/.test(ln) && cur.body.length) { out.push(cur); cur = null; continue; }
      cur.body.push(ln);
    }
    if (cur) out.push(cur);
    return out.map(x => ({ ...x, body: x.body.join('\n').trim().replace(/^\(no text\)$/, '') })).filter(x => (x.body || x.media.length) && !isNaN(new Date(x.at)));
  },
  apply(l, msgs) {
    let n = 0, inbound = 0;
    for (const m of msgs) {
      const aid = 'quo_' + m.id; if (acts(l).some(a => a.id === aid)) continue;
      if (m.dir === 'out' && acts(l).some(a => a.type === 'text' && a.dir === 'out' && a.body === m.body && Math.abs(new Date(a.at) - new Date(m.at)) < 10 * 6e4)) continue;
      logActivity(l, clean({ id: aid, type: 'text', dir: m.dir, body: m.body || (m.media?.length ? '(photo or file)' : ''), media: m.media?.length ? m.media : undefined, at: iso(m.at), via: 'quo', status: m.dir === 'out' ? 'sent' : undefined }), { complete: false }); n++; if (m.dir === 'in') inbound++;
    }
    if (inbound && P().seq.stopOnReply && l.sequence) Auto.unenroll(l, { reason: `Sequence stopped: ${l.name} replied by text` });
    return { n, inbound };
  },
  async syncLead(l0) {
    const to = this.e164(l0.phone); if (!to) throw { code: 'no_phone' };
    const p = await MCP.call('Quo', 'fetch-messages', { inboxPhoneNumber: this.from(), participantPhoneNumber: to, maxResults: 50 });
    const all = this.parse(this.txt(p)), mine = all.filter(m => m.phone === to), l = fresh(l0), r = this.apply(l, mine.length ? mine : all); if (r.n) saveLead(l); return r;
  },
  async checkAll(days = 7) {
    const p = await MCP.call('Quo', 'fetch-messages', { inboxPhoneNumber: this.from(), createdAfter: new Date(Date.now() - days * DAY).toISOString() });
    const msgs = this.parse(this.txt(p)); const byPhone = new Map(); leadsArr().forEach(l => { const e = this.e164(l.phone); if (e) byPhone.set(e, l); });
    let total = 0, inbound = 0; const touched = new Set(), replied = [];
    for (const [ph, group] of Object.entries(msgs.reduce((a, m) => ((a[m.phone] ||= []).push(m), a), {}))) {
      const l = byPhone.get(ph);
      if (!l) { const ins = group.filter(m => m.dir === 'in'); if (ins.length) S.msgUnknown.set(ph, { phone: ph, last: ins.sort((a, b) => b.at.localeCompare(a.at))[0], count: ins.length }); continue; }
      const r = this.apply(l, group); if (r.n) { total += r.n; inbound += r.inbound; touched.add(l.id); if (r.inbound) replied.push(l.id); }
    }
    touched.forEach(id => { const l = S.leads.get(id); if (l) saveLead(l); });
    this.lastCheck = Date.now(); scheduleRender();
    for (const id of replied) { const l = S.leads.get(id); if (l) await Bot.handle(l).catch(() => {}); }
    return { total, inbound };
  },
};

const GM = {

  room(title = '') {

  save(m) { m.updatedAt = iso(now()); S.meetings.set(m.id, m); Store.put('meetings/' + m.id, m); scheduleRender(); },
  inv: l => clean({ leadId: l.id, name: l.name, email: l.email || '', phone: l.phone || '' }),

/* ---------------- Calendar: Hash Calendar (MIT, by Supun Lakmal) bundled under calendar/ ----------------
   Hash Calendar keeps its whole calendar in its URL hash. The CRM saves that hash in config/calendar,
   hands it back when the calendar opens, and adds upcoming CRM meetings to it once each. */
const CalApp = {
  hash: '', loaded: false, synced: new Set(), ready: false, aligned: false, saveT: null, pend: {},
  frame() { return document.getElementById('calFrame'); },
  remote(d) {
    const h = typeof d?.hash === 'string' ? d.hash : '';
    this.synced = new Set(Array.isArray(d?.synced) ? d.synced : []);
    const was = this.loaded; this.loaded = true;
    if (h !== this.hash || !was) { this.hash = h; this.push(); }
    scheduleRender();
  },
  mount() { this.ready = false; this.aligned = this.loaded; },
  push() { const f = this.frame(); if (!f?.contentWindow || !this.ready) return; try { f.contentWindow.postMessage({ source: 'ge-crm', type: 'set', hash: this.hash || '' }, '*'); this.aligned = true; } catch {} },
  save() { clearTimeout(this.saveT); this.saveT = setTimeout(() => { if (Store.db) Store.put('config/calendar', { hash: this.hash || '', synced: [...this.synced].slice(-3000), updatedAt: iso(now()) }); }, 700); },
  onMsg(e) {
    const f = this.frame(); if (!f || e.source !== f.contentWindow) return;
    const d = e.data; if (!d || d.source !== 'ge-calendar') return;
    if (d.type === 'ready') { this.ready = true; if (S.store === 'memory' && !this.loaded) this.loaded = true; if (this.loaded) this.push(); setTimeout(() => this.sync(), 2500); this.status(); }
    else if (d.type === 'hash') { if (!this.loaded || !this.aligned || typeof d.hash !== 'string' || d.hash === this.hash) return; this.hash = d.hash; this.save(); }
    else if (d.type === 'added') {
      const keys = this.pend[d.id] || []; delete this.pend[d.id];
      if (d.locked || d.busy || d.error) keys.forEach(k => this.synced.delete(k)); else { this.save(); if (d.added) toast(keys[0]?.startsWith('gc:') ? `Added ${d.added} Google Calendar event${d.added > 1 ? 's' : ''}` : `Added ${d.added} CRM meeting${d.added > 1 ? 's' : ''} to your Calendar`); }
      if (d.locked) this.status('Your calendar is locked with a password, so CRM meetings can’t be added until you unlock it.');
    }
  },
  status(msg) { const el = document.getElementById('calState'); if (el) el.textContent = msg || (S.store === 'memory' ? 'This copy can’t save. Open the CRM from Claude to keep your calendar.' : 'Saved with your CRM, so it’s the same on every device.'); },
  upcoming() {
    const out = [], a = startOfDay(now()), b = addDays(a, 90);
    for (const m of (typeof GM !== 'undefined' ? GM.list() : [])) { const t = new Date(m.start); if (t >= a && t < b && !m.instant) out.push({ key: 'g:' + m.id, start: t, dur: +m.durationMin || 30, title: `${m.title} (video)` }); }
    for (const l of S.leads.values()) for (const x of acts(l)) if (x.type === 'meeting' && x.scheduledFor && !x.gmId) { const t = new Date(x.scheduledFor); if (t >= a && t < b) out.push({ key: 'm:' + x.id, start: t, dur: +x.durationMin || 30, title: x.subject || `Meeting with ${l.name}` }); }
    return out;
  },
  gBusy: false,
  /* Google Calendar → Hash Calendar: adds each Google event once (past 2 weeks, next 90 days). */
  async google(manual) {
    if (this.gBusy) return; if (!MCP.api || S.int.calendar === 'off' || S.int.calendar === 'missing') { if (manual) toast('Google Calendar isn’t connected here. Add it in claude.ai Settings → Connectors.', 'err'); return; }
    if (!this.ready || !this.loaded || !this.aligned) { if (manual) toast('The calendar is still loading. Try again in a moment.', 'err'); return; }
    this.gBusy = true; if (manual) this.status('Reading your Google Calendar…');
    try {
      const a = addDays(startOfDay(now()), -14), b = addDays(startOfDay(now()), 90), evs = []; let tok = '';
      for (let page = 0; page < 6; page++) {
        const input = { startTime: isoOffset(a), endTime: isoOffset(b), orderBy: 'startTime', pageSize: 250 }; if (TZ) input.timeZone = TZ; if (tok) input.pageToken = tok;
        const p = await MCP.call('Google Calendar', 'list_events', input); evs.push(...(p?.events || [])); tok = p?.nextPageToken || ''; if (!tok) break;
      }
      S.int.calendar = 'ready';
      const crmIds = new Set(); for (const l of S.leads.values()) for (const x of acts(l)) if (x.calendar?.id) crmIds.add(x.calendar.id); for (const m of GM.list()) if (m.calendar?.id) crmIds.add(m.calendar.id);
      const color = Math.max(0, Math.min(4, +(P().cal?.googleColor ?? 1))), todo = [];
      for (const ev of evs) {
        if (!ev?.id || ev.status === 'cancelled' || crmIds.has(ev.id)) continue;
        const title = String(ev.summary || '(No title)').slice(0, 76);
        if (ev.start?.dateTime) { const st = new Date(ev.start.dateTime), en = new Date(ev.end?.dateTime || st); if (isNaN(st)) continue; todo.push({ key: `gc:${ev.id}:${ev.start.dateTime}`, start: st, dur: Math.max(0, Math.round((en - st) / 6e4)), title, color }); }
        else if (ev.start?.date) { const d0 = ymdToDate(String(ev.start.date).slice(0, 10)), d1 = ev.end?.date ? ymdToDate(String(ev.end.date).slice(0, 10)) : addDays(d0, 1); const n = Math.min(14, Math.max(1, daysBetween(d0, d1))); for (let i = 0; i < n; i++) todo.push({ key: `gc:${ev.id}:${ymd(addDays(d0, i))}`, start: addDays(d0, i), dur: 0, title: n > 1 ? `${title} (day ${i + 1} of ${n})` : title, color }); }
      }
      const fresh = todo.filter(x => !this.synced.has(x.key));
      if (!fresh.length) { if (manual) toast('Your calendar already has all your Google Calendar events.'); }
      else this.post(fresh);
      this.lastGoogle = Date.now();
    } catch (e) { if (manual) toast(MCP.err(e, 'Google Calendar'), 'err'); }
    finally { this.gBusy = false; this.status(); }
  },
  post(todo) {
    const f = this.frame(); if (!f?.contentWindow) return;
    for (let i = 0; i < todo.length; i += 150) {
      const chunk = todo.slice(i, i + 150), id = uid('cs'); this.pend[id] = chunk.map(x => x.key); chunk.forEach(x => this.synced.add(x.key));
      try { f.contentWindow.postMessage({ source: 'ge-crm', type: 'add', id, events: chunk.map(x => [Math.floor(x.start.getTime() / 60000), Math.max(0, Math.round(x.dur)), String(x.title).slice(0, 80), x.color ?? 2]) }, '*'); } catch {}
    }
  },
  sync(force) {
    if (P().cal?.google && S.view === 'calendar' && (!this.lastGoogle || Date.now() - this.lastGoogle > 30 * 60000)) this.google(false);
    if (!P().cal?.syncCrm && !force) return; if (!this.ready || !this.loaded || !this.aligned) return;
    const f = this.frame(); if (!f?.contentWindow) return;
    const todo = this.upcoming().filter(x => force || !this.synced.has(x.key)); if (!todo.length) { if (force) toast('Your upcoming CRM meetings are already on the Calendar.'); return; }
    const id = uid('cs'); this.pend[id] = todo.map(x => x.key); todo.forEach(x => this.synced.add(x.key));
    const events = todo.map(x => [Math.floor(x.start.getTime() / 60000), Math.max(0, Math.round(x.dur)), String(x.title).slice(0, 80), x.key.startsWith('g:') ? 3 : 2]);
    try { f.contentWindow.postMessage({ source: 'ge-crm', type: 'add', id, events }, '*'); } catch {}
  },
};

function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}

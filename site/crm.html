  goal(el) { S.settings.goals = { ...S.settings.goals, [el.dataset.k]: Math.max(0, +el.value || 0) }; saveSettings(); },

  seqName(el) { const s = S.settings.sequences.find(x => x.id === el.dataset.s); if (s) { s.name = el.value.trim() || s.name; saveSettings(); } },
  seqStep(el) {
    const s = S.settings.sequences.find(x => x.id === el.dataset.s); const st = s?.steps[+el.dataset.i]; if (!st) return; const k = el.dataset.k;

  add(name) { name = String(name || '').trim(); if (!name) return null; const ex = this.list().find(u => u.name.toLowerCase() === name.toLowerCase()); if (ex) return ex; const u = { id: uid('up'), name, status: 'Available', since: iso(now()), turnAt: iso(now()), day: todayYmd(), ups: 0, sold: 0, createdAt: iso(now()) }; this.save(u); return u; },
  setStatus(u, st) { u = this.day({ ...u }); const wasUp = this.isUp(u); u.status = st; u.since = iso(now()); delete u.cust; if (st === 'Available' && !wasUp) u.turnAt = iso(now()); if (st === 'Available' && wasUp) u.turnAt = u.turnAt || iso(now()); this.save(u); },
  label(u) { const hide = P().board?.hideNames !== false; return u.cust ? (hide || !u.cust.name ? (u.cust.kind === 'new' ? 'New customer' : u.cust.kind === 'lead' ? 'Customer' : 'Walk-in') : u.cust.name) : ''; },
  mins(u) { const m = Math.max(0, Math.round((Date.now() - new Date(u.since)) / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`; },
};
V.upboard = () => {
  if (!ready() || !S.loaded.ups) return topbar('Up Board') + loading();
  const mine = Ups.mine(), ups = Ups.ups(), down = Ups.down(), unread = Msg.threads().filter(t => t.unread), free = ups.filter(u => u.status === 'Available').length;
  const pill = s => `<span class="upill ${upTone(s)}">${esc(s)}</span>`;
  const stat = u => (u.day === todayYmd() ? `${u.ups || 0} up${(u.ups || 0) === 1 ? '' : 's'} · ${u.sold || 0} sold` : '0 ups today');
  const row = (u, i) => `<button type="button" class="uprow" data-a="upOpen" data-id="${u.id}"><span class="upn">${i ? i : ''}</span><span class="upname"><b>${esc(u.name)}</b><span class="sub">${u.status === 'With customer' ? esc(Ups.label(u) || 'With a customer') + ' · ' + Ups.mins(u) : esc(stat(u))}</span></span><span class="upr"><time>${fmtTime(u.status === 'Available' ? u.turnAt || u.since : u.since)}</time>${pill(u.status)}</span></button>`;
  const names = (S.settings.team || []).filter(n => !Ups.list().some(u => u.name.toLowerCase() === n.toLowerCase()));
  return topbar('Up Board', 'Who is up next on the floor.') + `
  <div class="upbar"><div><div class="sub">MY STATUS</div>${mine ? pill(mine.status) : '<span class="upill down">Not on the board</span>'}</div>
    <div class="upbar-r"><span>${ic('flame')} ${esc(P().profile.business || 'Store')}</span><span>Rotation list · ${free} available</span></div></div>
  <button type="button" class="upmy" data-a="upMine">${mine ? 'My Actions' : `Join the board as ${esc(me())}`} ${ic('arrow')}</button>
  ${free ? `<div class="frow" style="margin:10px 0"><button type="button" class="btn primary" data-a="upNext">${ic('assign')} Customer walks in: assign next up</button></div>` : ''}
  <section class="panel upmsgs"><div class="panel-h"><h2>Texts from Quo ${unread.length ? `<span class="ubadge">${unread.length}</span>` : ''}</h2><div class="sp">${SMS.on() ? `<button type="button" class="btn sm" data-a="msgCheck">${ic('refresh')} Get new texts</button>` : ''}<button type="button" class="btn ghost sm" data-a="go" data-v="messages">Open Messages</button></div></div>
    ${unread.length ? `<ul class="tlist">${unread.slice(0, 5).map(x => `<li><button type="button" class="linkish" data-a="upMsg" data-id="${esc(x.id)}"><b>${esc(x.l ? x.l.name : SMS.pretty(x.u.phone))}</b></button><span class="sub" style="margin-left:8px">${esc(String(x.last?.body || (x.last?.media?.length ? 'Photo' : '')).slice(0, 80))} · ${esc(ago(x.last?.at))}</span></li>`).join('')}</ul>` : `<p class="hint">${SMS.on() ? 'No unread texts.' : 'Connect Quo to see customer texts here.'}</p>`}</section>
  <div class="uphead">Up List</div>
  <div class="uplist">${ups.length ? ups.map((u, i) => row(u, i + 1)).join('') : '<p class="hint" style="padding:14px">Nobody is on the up list. Add your team below.</p>'}</div>
  <div class="uphead">Down List</div>
  <div class="uplist">${down.length ? down.map(u => row(u, 0)).join('') : '<p class="hint" style="padding:14px;text-align:center">No users on the Down List</p>'}</div>
  <section class="panel" style="margin-top:14px"><div class="panel-h"><h2>Team on the board</h2></div>
    <div class="frow"><input id="upNewName" placeholder="Add a salesperson" aria-label="Salesperson name" style="min-width:200px"><button type="button" class="btn primary" data-a="upAdd">${ic('plus')} Add</button></div>
    ${names.length ? `<div class="jump" style="margin-top:8px">${names.map(n => `<button type="button" class="chip" data-a="upAddName" data-v="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>` : ''}
    <p class="hint">Reps go to the bottom of the up list when they finish a customer or come back from a break. Everyone sees the same board live. ${P().board?.hideNames !== false ? 'Customer names are hidden on this board.' : ''}</p></section>`;
};
function upModal(id) {
  const u = S.ups.get(id); if (!u) return;
  const b = (a, lab, v, cls = '') => `<button type="button" class="btn ${cls}" data-a="${a}" data-id="${u.id}" ${v ? `data-v="${esc(v)}"` : ''}>${lab}</button>`;
  let body = `<p class="hint">${esc(u.name)} is <b>${esc(u.status)}</b>${u.status === 'With customer' ? ' (' + Ups.mins(u) + ')' : ''}.</p><div class="frow" style="gap:8px">`;
  if (u.status === 'Available') body += b('upTake', 'Take a customer', '', 'primary') + UP_DOWN.map(s => b('upStatus', s, s)).join('');
  else if (u.status === 'With customer') body += b('upFinish', 'Finish this customer', '', 'primary');
  else body += b('upStatus', 'Back on the up list', 'Available', 'primary') + UP_DOWN.filter(s => s !== u.status).map(s => b('upStatus', s, s)).join('');
  body += `</div>`;
  Modal.open(u.name, body, `<button type="button" class="btn ghost" data-a="upRemove" data-id="${u.id}" data-confirm="Remove ${esc(u.name)} from the board">Remove from board</button>`);
}
function upTakeModal(id) {
  const u = S.ups.get(id); if (!u) return;
  const L = leadsArr().sort((a, b) => a.name.localeCompare(b.name)).slice(0, 400);
  Modal.open(`${u.name} takes a customer`, `<datalist id="upLeads">${L.map(l => `<option value="${esc(l.name)}"></option>`).join('')}</datalist>
    <label class="fld"><span>Existing customer (optional)</span><input id="upCust" list="upLeads" placeholder="Search your customers" autocomplete="off"></label>
    <div class="fgrid"><label class="fld"><span>Or a new customer’s name</span><input id="upNewCust" placeholder="Name"></label><label class="fld"><span>Phone</span><input id="upNewPhone" type="tel" placeholder="Optional"></label></div>
    <p class="hint">Leave all three blank for a walk-in. New customers are added to your leads as Walk-in.</p>`, `<button type="button" class="btn primary" data-a="upTakeGo" data-id="${u.id}">Start with customer</button>`);
}
Object.assign(A, {
  upOpen(el) { upModal(el.dataset.id); },
  upMine() { const m = Ups.mine() || Ups.add(me()); if (m) upModal(m.id); },
  upAdd() { const i = $('#upNewName'); const u = Ups.add(i?.value); if (i) i.value = ''; if (!u) toast('Type a name first.', 'err'); },
  upAddName(el) { Ups.add(el.dataset.v); },
  upStatus(el) { const u = S.ups.get(el.dataset.id); if (!u) return; Ups.setStatus(u, el.dataset.v); Modal.close(); },
  upTake(el) { upTakeModal(el.dataset.id); },
  upNext() { const u = Ups.ups().find(x => x.status === 'Available'); if (u) upTakeModal(u.id); },
  upTakeGo(el) {
    const u0 = S.ups.get(el.dataset.id); if (!u0) return; const u = Ups.day({ ...u0 });
    const q = String($('#upCust')?.value || '').trim().toLowerCase(), nn = String($('#upNewCust')?.value || '').trim(), ph = String($('#upNewPhone')?.value || '').trim();
    let cust = { kind: 'walk' }; const ex = q && leadsArr().find(l => l.name.toLowerCase() === q);
    if (ex) { cust = { kind: 'lead', leadId: ex.id, name: ex.name }; const l = fresh(ex); logActivity(l, { type: 'note', body: `In-store visit: ${u.name} is helping ${firstName(l.name)}.` }); saveLead(l); }
    else if (nn) { const l = createLead({ name: nn, phone: ph, source: 'Walk-in', temperature: 'hot', sequenceId: '', note: `In-store visit with ${u.name}.` }); cust = { kind: 'new', leadId: l.id, name: nn }; }
    else if (q) { toast('No customer with that name. Clear the box or add them as a new customer.', 'err'); return; }
    u.status = 'With customer'; u.since = iso(now()); u.cust = cust; Ups.save(u); Modal.close();
  },
  upFinish(el) {
    const u = S.ups.get(el.dataset.id); if (!u) return;
    Modal.open(`Finish with ${Ups.label(u) || 'customer'}`, `<label class="fld"><span>How did it go?</span><select id="upOut">${['Sold', 'Follow up later', 'Not buying today', 'Just looking'].map(o => `<option>${o}</option>`).join('')}</select></label>
      <label class="chk"><input type="checkbox" id="upTurn" checked> Counts as my turn (go to the bottom of the up list)</label>
      <label class="fld"><span>Note (optional)</span><textarea id="upNote" rows="2"></textarea></label>`, `<button type="button" class="btn primary" data-a="upFinishGo" data-id="${u.id}">Done</button>`);
  },
  upFinishGo(el) {
    const u0 = S.ups.get(el.dataset.id); if (!u0) return; const u = Ups.day({ ...u0 }), out = $('#upOut')?.value || 'Just looking', turn = $('#upTurn')?.checked, note = ($('#upNote')?.value || '').trim();
    const c = u.cust; if (c?.leadId && S.leads.has(c.leadId)) {
      const l = fresh(S.leads.get(c.leadId)); logActivity(l, { type: 'note', body: `In-store visit with ${u.name}: ${out}.${note ? '\n' + note : ''}` });
      if (out === 'Follow up later') addTask(l, { type: 'call', title: `Follow up after store visit${note ? ': ' + note.slice(0, 60) : ''}`, due: ymd(addDays(now(), 2)) });
      saveLead(l);
    }
    if (turn) { u.ups = (u.ups || 0) + 1; u.turnAt = iso(now()); } if (out === 'Sold') u.sold = (u.sold || 0) + 1;
    u.status = 'Available'; u.since = iso(now()); delete u.cust; Ups.save(u); Modal.close(); toast(out === 'Sold' ? 'Nice, that’s a sale.' : 'Back on the up list.');
  },
  upRemove(el) { S.ups.delete(el.dataset.id); Store.del('ups/' + el.dataset.id); Modal.close(); scheduleRender(); },
  upMsg(el) { const id = el.dataset.id; S.msg.sel = id; A.go({ dataset: { v: 'messages' } }); const l = S.leads.get(id); if (l) { Msg.read(l); Msg.pull(l); } render(); },
});
setInterval(() => { if (S.view === 'upboard' && $('#modal')?.hidden !== false) scheduleRender(); }, 30000);

/* pipeline drag & drop */
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (!c) return; S.dragging = c.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', c.dataset.drag); } catch {} });
document.addEventListener('dragend', () => { setTimeout(() => { S.dragging = null; }, 50); $$('.col.over').forEach(c => c.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop]'); if (!col || !S.dragging) return; e.preventDefault(); $$('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('[data-drop]'); if (!col || !S.dragging) return; e.preventDefault();
  const l = S.leads.get(S.dragging), st = col.dataset.drop; col.classList.remove('over');
  if (l && l.stage !== st) { changeStage(l, st); saveLead(l); toast(`${l.name} → ${st}`); }
  S.dragging = null;
});

/* ---------------- boot ---------------- */
async function initCaps() {
  const use = n => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [sample, mcp, dl] = await Promise.all([use('sample'), use('mcp'), use('downloads')]);
  AI.fn = sample; S.int.ai = sample ? 'ready' : 'off';
  if (sample) { try { const lim = await sample.limits(); S.int.tools = lim?.tools ? 'ready' : 'off'; Agent.max = lim?.tools?.maxCount || 0; } catch { S.int.tools = 'off'; } } else S.int.tools = 'off';
  Files.dl = dl; S.int.downloads = dl ? 'ready' : 'off';
  MCP.api = mcp;
  if (!mcp) { S.int.gmail = 'off'; S.int.calendar = 'off'; S.int.sms = 'off'; }
  else {
    try {
      const r = await mcp.listTools();
      for (const [k, name] of [['gmail', 'Gmail'], ['calendar', 'Google Calendar']]) {
        const s = (r?.servers || []).find(x => x.server === name);
        S.int[k] = !s ? 'missing' : s.authStatus === 'needs_reauth' ? 'reauth' : 'ready';
      }
    } catch { if (S.int.gmail === 'checking') S.int.gmail = 'ready'; if (S.int.calendar === 'checking') S.int.calendar = 'ready'; }
    if (S.int.calendar !== 'missing' && lsGet('ge.cal') === '1') Cal.start();
    SMS.init();
  }
  scheduleRender();
}
const h = (location.hash || '').slice(1);
if (h && NAV.some(([, items]) => items.some(([v]) => v === h))) S.view = h;
render();
Store.init();
initCaps();
setInterval(() => { if (!document.hidden && !Pop.el) scheduleRender(); }, 60000);
setInterval(() => Outbox.tick(), 60000);
setTimeout(() => Outbox.tick(), 8000);
})();
</script>

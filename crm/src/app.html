<title>Good Expectations CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --sunken:#E9ECF1;
  --ink:#141A23; --ink-2:#3A4353; --muted:#667085; --line:#E1E5EC; --line-2:#CDD3DD;
  --accent:#13624F; --accent-hover:#0E5243; --accent-ink:#FFFFFF; --accent-soft:#E2F0EB;
  --gold:#B7800F; --gold-bar:#E9A92A; --gold-soft:#FBF1DC;
  --danger:#B42318; --danger-soft:#FDECEA; --warn:#A15C07; --warn-soft:#FEF3E2;
  --s-lead:#7A8699; --s-contacted:#3E7CB1; --s-proposal:#7B61C9; --s-negotiation:#C98217; --s-won:#13624F; --s-lost:#B8483B;
  --shadow:0 1px 2px rgba(20,26,35,.06),0 4px 16px rgba(20,26,35,.06);
  --shadow-lg:0 12px 48px rgba(20,26,35,.18);
  --radius:10px; --radius-sm:7px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1117; --surface:#161B23; --surface-2:#1B212B; --sunken:#0B0E13;
    --ink:#E8ECF2; --ink-2:#C3CAD5; --muted:#8E98A9; --line:#262D39; --line-2:#343D4C;
    --accent:#3DBB95; --accent-hover:#52C9A5; --accent-ink:#06231B; --accent-soft:#15302A;
    --gold:#F0C160; --gold-bar:#E3A93A; --gold-soft:#2E2512;
    --danger:#F2867A; --danger-soft:#3A1B18; --warn:#F2B25C; --warn-soft:#352612;
    --s-lead:#8C98AB; --s-contacted:#5C9AD0; --s-proposal:#9C86E0; --s-negotiation:#E0A043; --s-won:#3DBB95; --s-lost:#E0766A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --shadow-lg:0 12px 48px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1117; --surface:#161B23; --surface-2:#1B212B; --sunken:#0B0E13;
  --ink:#E8ECF2; --ink-2:#C3CAD5; --muted:#8E98A9; --line:#262D39; --line-2:#343D4C;
  --accent:#3DBB95; --accent-hover:#52C9A5; --accent-ink:#06231B; --accent-soft:#15302A;
  --gold:#F0C160; --gold-bar:#E3A93A; --gold-soft:#2E2512;
  --danger:#F2867A; --danger-soft:#3A1B18; --warn:#F2B25C; --warn-soft:#352612;
  --s-lead:#8C98AB; --s-contacted:#5C9AD0; --s-proposal:#9C86E0; --s-negotiation:#E0A043; --s-won:#3DBB95; --s-lost:#E0766A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 12px 48px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:750 13px/1 var(--f-display)}
.brand-name{font:650 15px/1.15 var(--f-display)}
.brand-sub{font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--radius-sm);background:none;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none;opacity:.8}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn[aria-current="page"] svg{opacity:1}
.nav-count{margin-left:auto;font:500 11px/1 var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 7px}
.nav-count.alert{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.kbd{font:500 11px/1 var(--f-mono);padding:3px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--surface)}
.cmdk-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);cursor:pointer;text-align:left;white-space:nowrap}
.cmdk-btn svg{flex:none}
.cmdk-btn:hover{border-color:var(--line-2);color:var(--ink)}
.cmdk-btn .kbd{margin-left:auto}

.main{min-width:0;padding:28px clamp(16px,3vw,40px) 64px}
.main-inner{max-width:1360px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.page-head h1{font-size:clamp(26px,3vw,34px);font-weight:750;line-height:1.05}
.page-head .sub{margin-top:6px;color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}

.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:20px;padding:10px 14px;border-radius:var(--radius);background:var(--gold-soft);color:var(--ink-2);font-size:13.5px}
.demo-bar strong{color:var(--ink)}
.demo-bar button{margin-left:auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:none}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--radius-sm);border:0;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.input,.select,.textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;min-height:88px;padding:9px 11px;resize:vertical;line-height:1.45}
.select{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder,.textarea::placeholder{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:34px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.toolbar .select{width:auto;min-width:130px}

/* ---------- cards & panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 18px 0}
.panel-head h2{font-size:16px}
.panel-body{padding:14px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-val{font:500 clamp(22px,2.4vw,28px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-val.gold{color:var(--gold)}
.kpi-note{font-size:12.5px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.attn{display:flex;flex-direction:column}
.attn-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.attn-item:first-child{border-top:0}
.attn-item:hover .attn-title{color:var(--accent)}
.flag{flex:none;width:8px;height:8px;border-radius:50%}
.flag.danger{background:var(--danger)} .flag.warn{background:var(--gold-bar)} .flag.info{background:var(--s-contacted)}
.attn-main{min-width:0;flex:1}
.attn-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-meta{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:20px;font:500 11.5px/1 var(--f-mono);white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.tag{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:5px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:4px}

.stagebars{display:flex;flex-direction:column;gap:12px}
.sb-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:12px}
.sb-label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.sb-track{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;position:relative}
.sb-fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.sb-weight{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--gold-bar)}
.sb-val{font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:112px}
.sb-val span{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed-item:first-child{border-top:0}
.feed-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.feed-ico svg{width:14px;height:14px}
.feed-ico.call{color:var(--s-contacted)} .feed-ico.email{color:var(--s-proposal)} .feed-ico.meeting{color:var(--s-negotiation)} .feed-ico.note{color:var(--accent)}
.feed-body{font-size:14px;white-space:pre-wrap;word-break:break-word}
.feed-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.feed-meta a{cursor:pointer;text-decoration:none;font-weight:600}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ---------- contacts table ---------- */
.dup-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 14px;border-radius:var(--radius);background:var(--warn-soft);color:var(--ink-2);margin-bottom:14px;font-size:14px}
.dup-banner strong{color:var(--warn)}
.dup-banner .btn{margin-left:auto}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table.data{width:100%;border-collapse:collapse;min-width:820px}
.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font:500 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.data td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.data tr:last-child td{border-bottom:0}
.data tbody tr{cursor:pointer;transition:background .1s}
.data tbody tr:hover{background:var(--surface-2)}
.data .r{text-align:right}
.person{display:flex;align-items:center;gap:11px;min-width:0}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:650 12.5px/1 var(--f-display);color:#fff}
.person-name{font-weight:600;white-space:nowrap}
.person-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cell-link{color:var(--ink-2);text-decoration:none;white-space:nowrap}
.cell-link:hover{color:var(--accent);text-decoration:underline}
.contact-cards{display:none}

/* ---------- pipeline ---------- */
.pipe-summary{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:16px;font-size:14px;color:var(--muted)}
.pipe-summary b{font:500 15px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.pipe-summary b.gold{color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-height:220px;padding:10px;border-radius:var(--radius);background:var(--sunken);border:1px dashed transparent;transition:border-color .12s,background .12s}
.col.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;flex-direction:column;gap:2px;padding:2px 4px 6px}
.col-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.col-title .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.col-sum{font:500 12.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;cursor:grab;box-shadow:0 1px 1px rgba(20,26,35,.04);display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--stage)}
.deal:hover{border-color:var(--line-2);border-top-color:var(--stage)}
.deal.dragging{opacity:.45}
.deal-title{font-weight:650;line-height:1.3}
.deal-who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.deal-val{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.col-add{border:1px dashed var(--line-2);background:none;border-radius:var(--radius-sm);padding:8px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
.col-add:hover{color:var(--accent);border-color:var(--accent);background:var(--surface)}

/* ---------- tasks ---------- */
.quick-task{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 140px 190px auto;gap:8px;padding:12px;margin-bottom:18px}
.task-group{margin-bottom:18px}
.task-group-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.task-group-head h2{font-size:15px}
.task-group-head .n{font:500 12px var(--f-mono);color:var(--muted)}
.task-group-head.overdue h2{color:var(--danger)}
.task-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{appearance:none;width:20px;height:20px;border:2px solid var(--line-2);border-radius:6px;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-title{font-weight:550;cursor:pointer;word-break:break-word}
.task-title:hover{color:var(--accent)}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.prio-high{color:var(--danger);font-weight:600}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:40;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.drawer-head .avatar{width:48px;height:48px;font-size:17px}
.drawer-head h2{font-size:22px;font-weight:700;line-height:1.15}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:22px}
.drawer-sec h3{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fact{min-width:0}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-weight:500;word-break:break-word;display:flex;align-items:center;gap:4px}
.copy{border:0;background:none;padding:2px;color:var(--muted);cursor:pointer;border-radius:4px;display:inline-grid}
.copy:hover{color:var(--accent)}
.copy svg{width:13px;height:13px}
.mini-deal{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:6px}
.mini-deal:hover{border-color:var(--line-2);background:var(--surface-2)}
.composer{border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{border:0;width:100%;min-height:70px;padding:10px 12px;resize:vertical;background:none;outline:none}
.composer-bar{display:flex;align-items:center;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.type-chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.type-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.composer-bar .btn{margin-left:auto}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{position:relative;z-index:51;width:min(560px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .16s ease;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal > form{display:flex;flex-direction:column;min-height:0;max-height:inherit}
.modal.wide{width:min(820px,100%)}
.modal.narrow{width:min(420px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0}
.modal-head h2{font-size:19px}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.warn-box{padding:10px 12px;border-radius:var(--radius-sm);background:var(--warn-soft);color:var(--ink-2);font-size:13.5px}
.warn-box strong{color:var(--warn)}
.form-error{color:var(--danger);font-size:13.5px;font-weight:500}
.form-error:empty{display:none}

.palette{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal-box{position:relative;z-index:61;width:min(600px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .14s ease}
.pal-input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:none}
.pal-list{max-height:min(420px,55vh);overflow-y:auto;padding:6px}
.pal-group{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 6px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.pal-item svg{width:16px;height:16px;color:var(--muted);flex:none}
.pal-item .meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pal-item[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.pal-item[aria-selected="true"] svg{color:var(--accent)}

.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-lg);font-weight:500;font-size:14px;animation:pop .16s ease}
.toast.error{background:var(--danger);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.login-card h1{font-size:26px;font-weight:750}
.loading{min-height:100%;display:grid;place-items:center;color:var(--muted)}

@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.3}}
@keyframes pop{from{transform:translateY(6px) scale(.985);opacity:.4}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .quick-task{grid-template-columns:minmax(0,1fr) 150px 130px}
  .quick-task .qt-title{grid-column:1/-1}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav-btn{flex-direction:column;gap:3px;padding:6px 4px;font-size:11.5px;align-items:center;flex:1}
  .nav-count{display:none}
  .main{padding-bottom:100px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-wrap{display:none}
  .contact-cards{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .contact-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  .contact-card:first-child{border-top:0}
  .contact-card .right{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted)}
  .board{grid-template-columns:repeat(6,minmax(78vw,1fr));scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .quick-task{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid-2,.facts{grid-template-columns:minmax(0,1fr)}
  .sb-row{grid-template-columns:90px minmax(0,1fr)}
  .sb-val{grid-column:2;text-align:left;min-width:0}
  .search{max-width:none}
}

<script>
"use strict";
/* =========================================================
   Good Expectations CRM
   Talks to /api/crm/* when deployed; falls back to a local
   demo with sample data when no backend is reachable.
   ========================================================= */

const STAGES = [
  { id: "lead",        label: "Lead",        p: 10 },
  { id: "contacted",   label: "Contacted",   p: 25 },
  { id: "proposal",    label: "Proposal",    p: 50 },
  { id: "negotiation", label: "Negotiation", p: 75 },
  { id: "won",         label: "Won",         p: 100 },
  { id: "lost",        label: "Lost",        p: 0 },
];
const OPEN = ["lead", "contacted", "proposal", "negotiation"];
const STALE_DAYS = 14;
const SOURCES = ["Referral", "Website", "Walk-in", "Social", "Cold outreach", "Event", "Other"];
const RECUR = { none: "Doesn't repeat", daily: "Daily", weekly: "Weekly", biweekly: "Every 2 weeks", monthly: "Monthly" };
const AVATAR_COLORS = ["#13624F", "#3E7CB1", "#7B61C9", "#B7800F", "#B8483B", "#2F7F86", "#5B6B82", "#8A5A2B"];

const S = {
  mode: "loading", demo: false, view: "today",
  data: { contacts: [], deals: [], tasks: [], activities: [] },
  q: "", tag: "", sort: "name", showDone: false,
  drawerContact: null, composerType: "note", loginError: "",
};

/* ---------- small utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowISO = () => new Date().toISOString();
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
function addDays(dateStr, n) { const d = dateStr ? new Date(dateStr + "T12:00:00") : new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(dateStr, n) { const d = dateStr ? new Date(dateStr + "T12:00:00") : new Date(); d.setMonth(d.getMonth() + n); return ymd(d); }
function dayDiff(dateStr) { if (!dateStr) return null; const a = new Date(dateStr + "T12:00:00"), b = new Date(today() + "T12:00:00"); return Math.round((a - b) / 864e5); }
function daysSince(iso) { return Math.floor((Date.now() - new Date(iso).getTime()) / 864e5); }
const money = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n || 0);
function moneyShort(n) { n = n || 0; if (n >= 1e6) return "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M"; if (n >= 1e4) return "$" + Math.round(n / 1e3) + "k"; return money(n); }
const digits = (p) => String(p || "").replace(/\D/g, "");
function fmtPhone(p) {
  const d = digits(p);
  if (d.length === 10) return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === "1") return `+1 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7)}`;
  return p || "";
}
function initials(name) { const p = String(name || "?").trim().split(/\s+/); return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); }
function avatarColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function avatar(c) { return `<span class="avatar" style="background:${avatarColor(c.id + c.name)}" aria-hidden="true">${esc(initials(c.name))}</span>`; }
function relTime(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  const d = Math.floor(s / 86400);
  if (d < 7) return d + "d ago";
  return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function fmtDate(dateStr) { if (!dateStr) return ""; const d = new Date(dateStr + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) }); }
function dueLabel(dateStr) {
  const n = dayDiff(dateStr);
  if (n === null) return "";
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n < 0) return `${-n} days overdue`;
  if (n < 7) return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", { weekday: "long" });
  return fmtDate(dateStr);
}
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const stageOf = (id) => STAGES.find((s) => s.id === id) || STAGES[0];
const probOf = (d) => (d.probability === null || d.probability === undefined || d.probability === "") ? stageOf(d.stage).p : Number(d.probability);
const contactById = (id) => S.data.contacts.find((c) => c.id === id);
const dealById = (id) => S.data.deals.find((d) => d.id === id);
const taskById = (id) => S.data.tasks.find((t) => t.id === id);
const isTyping = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);

const svg = (inner, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  contacts: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/>'),
  pipeline: svg('<rect x="3" y="4" width="4.5" height="16" rx="1.5"/><rect x="9.75" y="4" width="4.5" height="11" rx="1.5"/><rect x="16.5" y="4" width="4.5" height="7" rx="1.5"/>'),
  tasks: svg('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 2),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 2.2),
  x: svg('<path d="M6 6l12 12M18 6 6 18"/>', 2),
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>', 2),
  upload: svg('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', 2),
  download: svg('<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>', 2),
  note: svg('<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/>', 2),
  call: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>', 2),
  email: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>', 2),
  meeting: svg('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>', 2),
  system: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 2),
  merge: svg('<path d="M7 4v5a5 5 0 0 0 5 5h5M7 20v-6M14 11l3 3-3 3"/>', 2),
  logout: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5"/>'),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 2),
  repeat: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
};

/* =========================================================
   Local engine — mirrors the server's rules. Used on its own in
   demo mode, and for instant UI updates in live mode.
   ========================================================= */
const L = {
  logSystem(body, contact_id, deal_id) {
    S.data.activities.unshift({ id: uid(), type: "system", body, contact_id: contact_id || null, deal_id: deal_id || null, created_at: nowISO() });
  },
  createContact(f) { const ts = nowISO(); const c = { id: uid(), ...cleanContact(f), created_at: ts, updated_at: ts }; S.data.contacts.push(c); return c; },
  updateContact(id, f) { const c = contactById(id); Object.assign(c, cleanContact({ ...c, ...f }), { updated_at: nowISO() }); return c; },
  deleteContact(id) {
    S.data.contacts = S.data.contacts.filter((c) => c.id !== id);
    S.data.deals.forEach((d) => { if (d.contact_id === id) d.contact_id = null; });
    S.data.tasks.forEach((t) => { if (t.contact_id === id) t.contact_id = null; });
    S.data.activities = S.data.activities.filter((a) => a.contact_id !== id);
  },
  mergeContacts(keepId, dropId) {
    const a = contactById(keepId), b = contactById(dropId);
    for (const k of ["company", "title", "email", "phone", "source"]) a[k] = a[k] || b[k] || "";
    a.tags = [...new Set([...(a.tags || []), ...(b.tags || [])])];
    a.notes = [a.notes, b.notes].filter(Boolean).join("\n\n");
    a.updated_at = nowISO();
    for (const list of [S.data.deals, S.data.tasks, S.data.activities]) list.forEach((x) => { if (x.contact_id === dropId) x.contact_id = keepId; });
    S.data.contacts = S.data.contacts.filter((c) => c.id !== dropId);
    L.logSystem(`Merged duplicate "${b.name}" into this contact`, keepId);
    return a;
  },
  importContacts(rows) { let n = 0; for (const r of rows) { if (String(r.name || "").trim()) { L.createContact(r); n++; } } return { imported: n }; },
  createDeal(f) {
    const ts = nowISO();
    const d = { id: uid(), ...cleanDeal(f), created_at: ts, updated_at: ts, stage_changed_at: ts };
    S.data.deals.unshift(d);
    if (d.contact_id) L.logSystem(`Deal created: ${d.title}`, d.contact_id, d.id);
    return d;
  },
  updateDeal(id, f) {
    const d = dealById(id); const prev = d.stage; const ts = nowISO();
    Object.assign(d, cleanDeal({ ...d, ...f }), { updated_at: ts });
    if (d.stage !== prev) { d.stage_changed_at = ts; L.logSystem(`${d.title} moved from ${prev} to ${d.stage}`, d.contact_id, d.id); }
    return d;
  },
  deleteDeal(id) { S.data.deals = S.data.deals.filter((d) => d.id !== id); S.data.tasks.forEach((t) => { if (t.deal_id === id) t.deal_id = null; }); },
  createTask(f) { const ts = nowISO(); const t = { id: uid(), ...cleanTask(f), done: false, done_at: "", created_at: ts, updated_at: ts }; S.data.tasks.push(t); return t; },
  updateTask(id, f) {
    const t = taskById(id); const wasDone = t.done; const ts = nowISO();
    Object.assign(t, cleanTask({ ...t, ...f }), { updated_at: ts });
    t.done_at = t.done ? (t.done_at || ts) : "";
    let next = null;
    if (t.done && !wasDone && t.recurrence !== "none") {
      const due = t.recurrence === "monthly" ? addMonths(t.due_date || today(), 1) : addDays(t.due_date || today(), { daily: 1, weekly: 7, biweekly: 14 }[t.recurrence]);
      next = L.createTask({ ...t, due_date: due, done: false });
    }
    return { task: t, next };
  },
  deleteTask(id) { S.data.tasks = S.data.tasks.filter((t) => t.id !== id); },
  createActivity(f) {
    const a = { id: uid(), type: f.type, body: String(f.body).trim(), contact_id: f.contact_id || null, deal_id: f.deal_id || null, created_at: nowISO() };
    S.data.activities.unshift(a);
    const c = contactById(a.contact_id); if (c) c.updated_at = a.created_at;
    return a;
  },
  deleteActivity(id) { S.data.activities = S.data.activities.filter((a) => a.id !== id); },
};
function cleanContact(f) {
  const tags = Array.isArray(f.tags) ? f.tags : String(f.tags || "").split(",");
  return {
    name: String(f.name || "").trim(), company: String(f.company || "").trim(), title: String(f.title || "").trim(),
    email: String(f.email || "").trim().toLowerCase(), phone: String(f.phone || "").trim(), source: String(f.source || "").trim(),
    tags: [...new Set(tags.map((t) => String(t).trim().toLowerCase()).filter(Boolean))], notes: String(f.notes || "").trim(),
  };
}
function cleanDeal(f) {
  const p = f.probability === "" || f.probability === null || f.probability === undefined ? null : Math.max(0, Math.min(100, Math.round(Number(f.probability))));
  return { title: String(f.title || "").trim(), contact_id: f.contact_id || null, stage: STAGES.some((s) => s.id === f.stage) ? f.stage : "lead", value: Math.max(0, Number(f.value) || 0), probability: Number.isFinite(p) ? p : null, close_date: f.close_date || "", notes: String(f.notes || "").trim() };
}
function cleanTask(f) {
  return { title: String(f.title || "").trim(), due_date: f.due_date || "", priority: f.priority || "normal", recurrence: f.recurrence || "none", contact_id: f.contact_id || null, deal_id: f.deal_id || null, done: !!f.done };
}

/* ---------- live backend ---------- */
async function api(path, opts = {}) {
  const res = await fetch("/api/crm" + path, {
    credentials: "same-origin",
    headers: opts.body ? { "content-type": "application/json" } : {},
    ...opts,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== "/login") { S.mode = "login"; S.loginError = "Your session ended. Sign in again."; closeDrawer(); closeModal(); render(); throw new Error("Signed out"); }
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}
async function reload() { S.data = await api("/bootstrap"); }

/* Apply a change locally for instant feedback, then sync it to the
   server in live mode. On failure, reload server truth and say why. */
async function change(localFn, remote) {
  const result = localFn();
  render();
  if (S.demo) return result;
  try {
    const r = await remote();
    await reload(); render();
    return r ?? result;
  } catch (e) {
    toast(e.message, "error");
    try { await reload(); render(); } catch {}
    throw e;
  }
}
const J = (method, body) => ({ method, body: JSON.stringify(body) });
const B = {
  createContact: (f) => change(() => L.createContact(f), () => api("/contacts", J("POST", f))),
  updateContact: (id, f) => change(() => L.updateContact(id, f), () => api("/contacts/" + id, J("PATCH", f))),
  deleteContact: (id) => change(() => L.deleteContact(id), () => api("/contacts/" + id, { method: "DELETE" })),
  mergeContacts: (keep, drop) => change(() => L.mergeContacts(keep, drop), () => api("/contacts/merge", J("POST", { keep_id: keep, merge_id: drop }))),
  importContacts: (rows) => change(() => L.importContacts(rows), () => api("/contacts/import", J("POST", { rows }))),
  createDeal: (f) => change(() => L.createDeal(f), () => api("/deals", J("POST", f))),
  updateDeal: (id, f) => change(() => L.updateDeal(id, f), () => api("/deals/" + id, J("PATCH", f))),

/* ---------- derived data ---------- */
const openDeals = () => S.data.deals.filter((d) => OPEN.includes(d.stage));
const contactOpenValue = (id) => S.data.deals.filter((d) => d.contact_id === id && OPEN.includes(d.stage)).reduce((s, d) => s + d.value, 0);
function lastTouch(c) { let t = c.updated_at; for (const a of S.data.activities) if (a.contact_id === c.id && a.created_at > t) t = a.created_at; return t; }
const isStale = (d) => OPEN.includes(d.stage) && daysSince(d.stage_changed_at) >= STALE_DAYS;
const isPastClose = (d) => OPEN.includes(d.stage) && d.close_date && dayDiff(d.close_date) < 0;
const overdueTasks = () => S.data.tasks.filter((t) => !t.done && t.due_date && dayDiff(t.due_date) < 0);
const allTags = () => [...new Set(S.data.contacts.flatMap((c) => c.tags || []))].sort();
const normName = (c) => String(c.name || "").toLowerCase().replace(/[^a-z]/g, "");
function dupKeys(c) {
  const keys = [];
  if (c.email) keys.push("e:" + String(c.email).toLowerCase().trim());
  const p = digits(c.phone).slice(-10); if (p.length === 10) keys.push("p:" + p);
  if (normName(c).length > 3) keys.push("n:" + normName(c));
  return keys;
}
function duplicatePairs() {
  const map = new Map();
  for (const c of S.data.contacts) for (const k of dupKeys(c)) { if (!map.has(k)) map.set(k, []); map.get(k).push(c.id); }
  const pairs = new Map();
  for (const [k, ids] of map) {
    if (ids.length < 2) continue;
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const key = [ids[i], ids[j]].sort().join("|");
      if (!pairs.has(key)) pairs.set(key, { a: ids[i], b: ids[j], why: new Set() });
      pairs.get(key).why.add(k[0] === "e" ? "same email" : k[0] === "p" ? "same phone" : "same name");
    }
  }
  return [...pairs.values()].filter((p) => contactById(p.a) && contactById(p.b));
}
function matchesFor(f, excludeId) {
  const keys = new Set(dupKeys(f));
  if (!keys.size) return [];
  return S.data.contacts.filter((c) => c.id !== excludeId && dupKeys(c).some((k) => keys.has(k)));
}

/* ---------- Contacts ---------- */
function filteredContacts() {
  const q = S.q.trim().toLowerCase();
  const list = S.data.contacts.filter((c) => {
    if (S.tag && !(c.tags || []).includes(S.tag)) return false;
    if (!q) return true;
    const hay = [c.name, c.company, c.title, c.email, c.phone, digits(c.phone), (c.tags || []).join(" "), c.notes].join(" ").toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  });
  const by = {
    name: (a, b) => a.name.localeCompare(b.name),
    recent: (a, b) => lastTouch(b).localeCompare(lastTouch(a)),
    value: (a, b) => contactOpenValue(b.id) - contactOpenValue(a.id),
    company: (a, b) => (a.company || "~").localeCompare(b.company || "~"),
  }[S.sort];
  return list.sort(by);
}

}

/* ---------- Pipeline ---------- */
function viewPipeline() {
  const open = openDeals();
  const pipeValue = open.reduce((s, d) => s + d.value, 0);
  const weighted = open.reduce((s, d) => s + d.value * probOf(d) / 100, 0);
  return `
  <div class="page-head">
    <div><div class="eyebrow">Deals by stage</div><h1>Pipeline</h1></div>
    <div class="head-actions"><button class="btn btn-primary" data-action="new-deal">${ICON.plus}Add deal</button></div>
  </div>
  <div class="pipe-summary"><span>Open <b>${money(pipeValue)}</b></span><span>Weighted forecast <b class="gold">${money(weighted)}</b></span><span>Stalled <b>${open.filter(isStale).length}</b></span><span>Drag cards between stages. Deals ${STALE_DAYS}+ days in one stage are flagged.</span></div>
  <div class="board">${STAGES.map((s) => {
    const ds = S.data.deals.filter((d) => d.stage === s.id).sort((a, b) => (a.close_date || "9999").localeCompare(b.close_date || "9999"));
    const val = ds.reduce((a, d) => a + d.value, 0);
    return `<section class="col" data-stage="${s.id}" aria-label="${s.label}">
      <div class="col-head"><div class="col-title"><span class="dot" style="background:var(--s-${s.id})"></span>${s.label}<span class="n">${ds.length}</span></div>
        <div class="col-sum">${money(val)}${OPEN.includes(s.id) ? ` · ${s.p}% odds` : ""}</div></div>
      ${ds.map(dealCard).join("")}
      ${OPEN.includes(s.id) ? `<button class="col-add" data-action="new-deal" data-stage="${s.id}">+ Add deal</button>` : ""}
    </section>`;
  }).join("")}</div>`;
}
function dealCard(d) {
  const c = contactById(d.contact_id);
  const open = OPEN.includes(d.stage);
  const dl = d.close_date ? dayDiff(d.close_date) : null;
  const closeChip = !d.close_date ? "" : isPastClose(d) ? `<span class="chip danger">Close ${fmtDate(d.close_date)}</span>` : open && dl <= 7 ? `<span class="chip warn">Close ${dueLabel(d.close_date)}</span>` : `<span class="chip">${open ? "Close " : ""}${fmtDate(d.close_date)}</span>`;
  return `<article class="deal" draggable="true" data-deal="${d.id}" data-action="edit-deal" data-id="${d.id}" style="--stage:var(--s-${d.stage})" tabindex="0">
    <div><div class="deal-title">${esc(d.title)}</div>${c ? `<div class="deal-who">${esc(c.name)}${c.company ? " · " + esc(c.company) : ""}</div>` : ""}</div>
    <div class="deal-row"><span class="deal-val">${money(d.value)}</span>${open ? `<span class="chip gold" title="Win probability">${probOf(d)}%</span>` : ""}</div>
    ${closeChip || isStale(d) ? `<div class="deal-row">${closeChip}${isStale(d) ? `<span class="chip warn">${daysSince(d.stage_changed_at)}d in stage</span>` : ""}</div>` : ""}
  </article>`;
}

/* ---------- Tasks ---------- */
const prioRank = (t) => ({ high: 0, normal: 1, low: 2 })[t.priority] ?? 1;
function viewTasks() {
  const open = S.data.tasks.filter((t) => !t.done);
  const sort = (list) => list.sort((a, b) => (a.due_date || "").localeCompare(b.due_date || "") || prioRank(a) - prioRank(b));
  const groups = [
    ["overdue", "Overdue", sort(open.filter((t) => t.due_date && dayDiff(t.due_date) < 0)), "Nothing overdue."],
    ["today", "Today", sort(open.filter((t) => t.due_date && dayDiff(t.due_date) === 0)), "Nothing due today."],
    ["upcoming", "Upcoming", sort(open.filter((t) => t.due_date && dayDiff(t.due_date) > 0)), "Nothing scheduled ahead."],
    ["someday", "No due date", sort(open.filter((t) => !t.due_date)), ""],
  ];
  const done = S.data.tasks.filter((t) => t.done).sort((a, b) => (b.done_at || "").localeCompare(a.done_at || ""));
  return `
  <div class="page-head"><div><div class="eyebrow">Follow-ups & to-dos</div><h1>Tasks</h1></div></div>
  <form class="panel quick-task" data-form="quick-task">
    <input class="input qt-title" id="qt-title" name="title" placeholder="Add a task, e.g. Call Maria about the proposal" required autocomplete="off" aria-label="Task">
    <input class="input" id="qt-due" name="due_date" type="date" value="${today()}" aria-label="Due date">
    <select class="select" id="qt-prio" name="priority" aria-label="Priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select>
    <select class="select" id="qt-rec" name="recurrence" aria-label="Repeat">${Object.entries(RECUR).map(([v, l]) => `<option value="${v}">${v === "none" ? "No repeat" : l}</option>`).join("")}</select>
    <select class="select" id="qt-contact" name="contact_id" aria-label="Contact"><option value="">No contact</option>${contactOptions()}</select>
    <button class="btn btn-primary" type="submit">${ICON.plus}Add</button>
  </form>
  ${groups.map(([k, l, list, emptyText]) => list.length || emptyText ? `<section class="task-group"><div class="task-group-head ${k}"><h2>${l}</h2><span class="n">${list.length}</span></div>
    ${list.length ? `<div class="task-list">${list.map(taskRow).join("")}</div>` : `<div class="muted" style="padding:0 2px 4px;font-size:14px">${emptyText}</div>`}</section>` : "").join("")}
  <section class="task-group"><div class="task-group-head"><h2>Done</h2><span class="n">${done.length}</span>${done.length ? `<button class="btn btn-ghost btn-sm" data-action="toggle-done">${S.showDone ? "Hide" : "Show"}</button>` : ""}</div>
    ${S.showDone && done.length ? `<div class="task-list">${done.slice(0, 50).map(taskRow).join("")}</div>` : ""}</section>`;
}
function taskRow(t) {
  const c = contactById(t.contact_id);
  const n = t.due_date ? dayDiff(t.due_date) : null;
  return `<div class="task ${t.done ? "done" : ""}">
    <input type="checkbox" class="check" data-action="toggle-task" data-id="${t.id}" ${t.done ? "checked" : ""} aria-label="Mark “${esc(t.title)}” ${t.done ? "not done" : "done"}">
    <div style="min-width:0"><div class="task-title" data-action="edit-task" data-id="${t.id}" role="button" tabindex="0">${esc(t.title)}</div>
      <div class="task-meta">
        ${t.due_date ? `<span class="${!t.done && n < 0 ? "chip danger" : !t.done && n === 0 ? "chip warn" : "chip"}">${t.done ? fmtDate(t.due_date) : dueLabel(t.due_date)}</span>` : ""}
        ${t.priority === "high" ? `<span class="prio-high">High priority</span>` : t.priority === "low" ? `<span>Low priority</span>` : ""}
        ${t.recurrence !== "none" ? `<span style="display:inline-flex;align-items:center;gap:4px">${ICON.repeat}${RECUR[t.recurrence]}</span>` : ""}
        ${c ? `<a class="cell-link" data-action="open-contact" data-id="${c.id}" style="cursor:pointer">${esc(c.name)}</a>` : ""}
      </div></div>
    <button class="icon-btn" data-action="delete-task" data-id="${t.id}" aria-label="Delete task">${ICON.x}</button>
  </div>`;
}
function contactOptions(sel) { return [...S.data.contacts].sort((a, b) => a.name.localeCompare(b.name)).map((c) => `<option value="${c.id}" ${sel === c.id ? "selected" : ""}>${esc(c.name)}${c.company ? " — " + esc(c.company) : ""}</option>`).join(""); }

          <div class="composer-bar">${["note", "call", "email", "meeting"].map((t) => `<button type="button" class="type-chip" data-action="composer-type" data-type="${t}" aria-pressed="${S.composerType === t}">${cap(t)}</button>`).join("")}

/* ---------- Modals ---------- */
const modalRoot = $("#modal-root");
let modalResolve = null;
function openModal(html, size = "") {
  if (modalResolve) { modalResolve(false); modalResolve = null; }
  modalRoot.hidden = false;
  modalRoot.innerHTML = `<div class="modal-wrap"><div class="scrim" data-action="close-modal"></div><div class="modal ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
  setTimeout(() => ($("[autofocus]", modalRoot) || $(".modal input, .modal select, .modal textarea, .modal .btn-primary", modalRoot))?.focus(), 20);
}
function closeModal() { modalRoot.hidden = true; modalRoot.innerHTML = ""; if (modalResolve) { modalResolve(false); modalResolve = null; } }
function confirmBox(title, text, label = "Delete") {
  return new Promise((res) => {
    openModal(`<div class="modal-head"><h2>${esc(title)}</h2></div><div class="modal-body"><p style="margin:0;color:var(--ink-2)">${esc(text)}</p></div>
      <div class="modal-foot"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);color:#fff" data-action="confirm-yes">${esc(label)}</button></div>`, "narrow");
    modalResolve = res;
  });
}
const modalHead = (title) => `<div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">${ICON.x}</button></div>`;

function contactForm(c) {

      <div class="grid-2">
        <div class="field"><label for="cf-company">Company</label><input class="input" id="cf-company" name="company" value="${esc(e.company)}" autocomplete="off"></div>
        <div class="field"><label for="cf-title">Job title</label><input class="input" id="cf-title" name="title" value="${esc(e.title)}" autocomplete="off"></div>
        <div class="field"><label for="cf-email">Email</label><input class="input" id="cf-email" name="email" type="email" value="${esc(e.email)}" autocomplete="off" data-dupcheck></div>

        <div class="field"><label for="cf-source">How they found you</label><select class="select" id="cf-source" name="source"><option value="">Not set</option>${SOURCES.map((s) => `<option ${e.source === s ? "selected" : ""}>${s}</option>`).join("")}${e.source && !SOURCES.includes(e.source) ? `<option selected>${esc(e.source)}</option>` : ""}</select></div>
        <div class="field"><label for="cf-tags">Tags</label><input class="input" id="cf-tags" name="tags" value="${esc((e.tags || []).join(", "))}" placeholder="dental, website" autocomplete="off"><span class="hint">Separate with commas</span></div>
      </div>
      <div class="field"><label for="cf-notes">Notes</label><textarea class="textarea" id="cf-notes" name="notes">${esc(e.notes)}</textarea></div>
      <div id="dup-warn"></div>
      <div class="form-error" id="form-error" role="alert"></div>
    </div>
    <div class="modal-foot">${c ? `<button type="button" class="btn btn-danger" data-action="delete-contact" data-id="${c.id}">Delete</button>` : ""}<span class="spacer"></span>
      <button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${c ? "Save changes" : "Add contact"}</button></div>
  </form>`);
  if (c) updateDupWarn();
}
function updateDupWarn() {
  const form = $('[data-form="contact"]', modalRoot); if (!form) return;
  const f = Object.fromEntries(new FormData(form));
  const m = matchesFor(f, form.dataset.id);
  if (!m.length) { $("#dup-warn").innerHTML = ""; return; }
  const mine = dupKeys(f);
  const shared = (ch) => mine.some((k) => k[0] === ch && m.some((c) => dupKeys(c).includes(k)));
  const what = shared("e") ? "email" : shared("p") ? "phone number" : "name";
  $("#dup-warn").innerHTML = `<div class="warn-box"><strong>Possible duplicate.</strong> ${m.slice(0, 3).map((c) => `<a href="#" data-action="open-contact" data-id="${c.id}">${esc(c.name)}${c.company ? " (" + esc(c.company) + ")" : ""}</a>`).join(", ")} already ${m.length === 1 ? "has" : "have"} this ${what}.</div>`;
}

function reviewDups() {

/* ---------- CSV import / export ---------- */
function parseCSV(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || "";
  const sep = (firstLine.match(/\t/g) || []).length > (firstLine.match(/,/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
const HEADER_MAP = {
  name: ["name", "fullname", "contact", "contactname", "displayname"], first: ["firstname", "first", "givenname"], last: ["lastname", "last", "surname", "familyname"],
  email: ["email", "emailaddress", "email1", "workemail", "email1value", "emailaddress1"], phone: ["phone", "phonenumber", "mobile", "cell", "mobilephone", "workphone", "telephone", "phone1value", "businessphone"],
  company: ["company", "organization", "organisation", "business", "account", "companyname", "organizationname"], title: ["title", "jobtitle", "position", "role", "organizationtitle"],
  tags: ["tags", "labels", "tag", "categories"], source: ["source", "leadsource"], notes: ["notes", "note", "description", "comments"],
};
function csvToContacts(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { contacts: [], mapped: [] };
  const head = rows[0].map((h) => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const idx = {};
  for (const [k, names] of Object.entries(HEADER_MAP)) { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) idx[k] = i; }
  const contacts = rows.slice(1).map((r) => {
    const g = (k) => (idx[k] !== undefined ? (r[idx[k]] || "").trim() : "");
    const name = g("name") || [g("first"), g("last")].filter(Boolean).join(" ") || g("email");
    return { name, email: g("email"), phone: g("phone"), company: g("company"), title: g("title"), tags: g("tags").split(/[;,|]/), source: g("source"), notes: g("notes") };
  }).filter((c) => c.name);
  const labels = { name: "Name", first: "First name", last: "Last name", email: "Email", phone: "Phone", company: "Company", title: "Title", tags: "Tags", source: "Source", notes: "Notes" };
  return { contacts, mapped: Object.keys(idx).map((k) => labels[k]) };
}
function importModal() {
  openModal(`${modalHead("Import contacts")}<div class="modal-body">
    <p class="muted" style="margin:0">Upload a CSV from Google Contacts, Outlook, a spreadsheet or another CRM. Name (or First and Last name), Email, Phone, Company, Title, Tags and Notes columns are matched automatically.</p>
    <div class="field"><label for="csv-file">CSV file</label><input class="input" id="csv-file" type="file" accept=".csv,text/csv,.txt,.tsv" style="padding:6px" data-change="csv-file"></div>
    <div class="field"><label for="csv-text">Or paste rows</label><textarea class="textarea num" id="csv-text" style="font-size:13px" placeholder="Name,Email,Phone,Company&#10;Maria Delgado,maria@example.com,813-555-0142,Carrollwood Dental" data-input="csv-text"></textarea></div>
    <div id="csv-preview"></div>
  </div><div class="modal-foot"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="csv-go" data-action="do-import" disabled>Import</button></div>`, "wide");
}
let pendingImport = [];
function previewImport(text) {
  const { contacts, mapped } = csvToContacts(text);
  const seen = new Set();
  const fresh = contacts.filter((c) => {
    const keys = dupKeys({ ...c, name: "" });
    if (keys.some((k) => seen.has(k))) return false;
    keys.forEach((k) => seen.add(k));
    return !matchesFor({ ...c, name: "" }).length;
  });
  const skipped = contacts.length - fresh.length;
  pendingImport = fresh;
  const btn = $("#csv-go");
  btn.disabled = !fresh.length;
  btn.textContent = fresh.length ? `Import ${plural(fresh.length, "contact")}` : "Import";
  $("#csv-preview").innerHTML = !text.trim() ? "" : !contacts.length ? `<div class="warn-box"><strong>No contacts found.</strong> Make sure the first row has column names, including Name or Email.</div>`
    : `<div class="panel" style="padding:12px 14px"><div style="font-weight:600">${plural(contacts.length, "row")} found${skipped ? ` · ${skipped} already in your CRM or repeated in the file, so ${skipped === 1 ? "it" : "they"}'ll be skipped` : ""}</div>
      <div class="muted" style="font-size:13px;margin-top:4px">Matched columns: ${mapped.join(", ")}</div>
      <div style="margin-top:10px;font-size:13.5px;display:flex;flex-direction:column;gap:3px">${fresh.slice(0, 5).map((c) => `<div><b>${esc(c.name)}</b> <span class="muted">${esc([c.company, c.email, fmtPhone(c.phone)].filter(Boolean).join(" · "))}</span></div>`).join("")}${fresh.length > 5 ? `<div class="muted">and ${fresh.length - 5} more</div>` : ""}</div></div>`;
}
function csvCell(v) { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const head = ["Name", "Company", "Title", "Email", "Phone", "Tags", "Source", "Notes", "Open deal value", "Added"];
  const csv = [head.join(",")].concat(S.data.contacts.map((c) => [c.name, c.company, c.title, c.email, fmtPhone(c.phone), (c.tags || []).join("; "), c.source, c.notes, contactOpenValue(c.id), String(c.created_at).slice(0, 10)].map(csvCell).join(","))).join("\r\n");
  if (!S.demo) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `contacts-${today()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Exported ${plural(S.data.contacts.length, "contact")}`);
    return;
  }
  openModal(`${modalHead("Export contacts")}<div class="modal-body"><p class="muted" style="margin:0">In your live CRM this downloads a .csv file. In the demo, copy it and paste into a spreadsheet.</p>
    <textarea class="textarea num" id="csv-out" readonly style="min-height:220px;font-size:12.5px">${esc(csv)}</textarea></div>
    <div class="modal-foot"><span class="spacer"></span><button class="btn" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="copy" data-from="#csv-out">${ICON.copy}Copy CSV</button></div>`, "wide");
}

  $('#pal-list [aria-selected="true"]')?.scrollIntoView({ block: "nearest" });

/* ---------- toast ---------- */
function toast(msg, kind = "", undo) {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { el.remove(); Promise.resolve(undo()).catch(() => {}); };
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), undo ? 6000 : 3200);
}

document.addEventListener("click", (e) => {

  const el = e.target.closest("[data-action]");
  if (!el || el.classList.contains("check")) return; // checkboxes act on change
  if (el.tagName === "A" && (!el.getAttribute("href") || el.getAttribute("href") === "#")) e.preventDefault();
  const fn = ACTIONS[el.dataset.action];
  if (fn) { const r = fn(el, e); if (r && r.catch) r.catch(() => {}); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.classList.contains("check") && el.dataset.action === "toggle-task") { ACTIONS["toggle-task"](el).catch(() => {}); return; }
  const k = el.dataset.change;
  if (k === "tag") { S.tag = el.value; render(); }
  else if (k === "sort") { S.sort = el.value; render(); }
  else if (k === "deal-stage") { const s = stageOf(el.value); $("#df-prob").placeholder = s.p; $("#df-prob-hint").textContent = `Leave blank to use the ${s.label} default (${s.p}%)`; }

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { if (S.mode !== "app") return; e.preventDefault(); palRoot.hidden ? openPalette() : closePalette(); return; }
  if (!palRoot.hidden) {
    if (e.key === "Escape") return closePalette();
    if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); renderPalette($("#pal-input").value); }
    if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPalette($("#pal-input").value); }
    if (e.key === "Enter") { e.preventDefault(); runPal(palSel); }
    return;
  }
  if (e.key === "Escape") { if (!modalRoot.hidden) return closeModal(); if (!drawerRoot.hidden) return closeDrawer(); }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.matches?.('[role="button"][data-action], article.deal')) { e.preventDefault(); t.click(); return; }
  if (isTyping(document.activeElement) || S.mode !== "app" || !modalRoot.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); if (S.view !== "contacts") go("contacts"); $("#contact-search")?.focus(); }
  else if (e.key === "n" && drawerRoot.hidden) { e.preventDefault(); ({ today: () => dealForm(), contacts: () => contactForm(), pipeline: () => dealForm(), tasks: () => $("#qt-title")?.focus() })[S.view](); }
  else if (["1", "2", "3", "4"].includes(e.key) && drawerRoot.hidden) go(["today", "contacts", "pipeline", "tasks"][+e.key - 1]);

document.addEventListener("submit", async (e) => {
  const form = e.target; const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  const fail = (m) => { const el = $("#form-error", form); if (el) el.textContent = m; };
  try {
    if (kind === "login") {
      S.loginError = "";
      const btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Signing in…";
      try { await api("/login", J("POST", { password: f.password })); await reload(); S.mode = "app"; render(); }
      catch (err) { S.loginError = err.message; render(); }
    } else if (kind === "contact") {
      if (!f.name.trim()) { $("#cf-name").focus(); return fail("Add a name."); }
      if (form.dataset.id) { await B.updateContact(form.dataset.id, f); closeModal(); toast("Contact saved"); }
      else {
        const before = new Set(S.data.contacts.map((c) => c.id));
        await B.createContact(f); closeModal(); toast("Contact added");
        const added = S.data.contacts.find((c) => !before.has(c.id) && c.name === f.name.trim());
        if (added) openContact(added.id);
      }
    } else if (kind === "deal") {
      if (!f.title.trim()) { $("#df-title").focus(); return fail("Give the deal a name."); }
      if (form.dataset.id) { await B.updateDeal(form.dataset.id, f); toast("Deal saved"); } else { await B.createDeal(f); toast("Deal added"); }
      closeModal();
    } else if (kind === "task") {
      if (!f.title.trim()) { $("#tf-title").focus(); return fail("Describe the task."); }
      if (form.dataset.id) { await B.updateTask(form.dataset.id, f); toast("Task saved"); } else { await B.createTask(f); toast("Task added"); }
      closeModal();
    } else if (kind === "quick-task") {
      if (!f.title.trim()) return;
      await B.createTask(f); toast("Task added");
      $("#qt-title")?.focus();
    } else if (kind === "activity") {
      if (!f.body.trim()) { $("#composer-text").focus(); return toast("Write something first", "error"); }
      const type = S.composerType;
      $("#composer-text").value = "";
      await B.createActivity({ type, body: f.body, contact_id: form.dataset.contact });
      toast(`${cap(type)} logged`);
    }
  } catch (err) { fail(err.message); }
});

/* ---------- boot ---------- */
function startDemo() { S.demo = true; S.data = seedDemo(); S.mode = "app"; render(); }
async function boot() {
  try { const t = localStorage.getItem("ge-crm-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
  let res;
  try { res = await fetch("/api/crm/me", { credentials: "same-origin" }); } catch { return startDemo(); }
  if (!(res.headers.get("content-type") || "").includes("application/json")) return startDemo();
  if (res.status === 401) { S.mode = "login"; return render(); }
  if (!res.ok) { const d = await res.json().catch(() => ({})); S.mode = "login"; S.loginError = d.error || "The CRM server isn't responding."; return render(); }
  try { await reload(); S.mode = "app"; render(); } catch (e) { S.mode = "login"; S.loginError = e.message; render(); }
}
boot();
</script>
